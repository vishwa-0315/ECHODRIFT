/*
 * LAUNCH WINDOW — mission-control look: near-black space, telemetry in mono,
 * condensed display type, ISRO-saffron accent, cyan trajectories.
 * Deliberately single (dark) theme, like a real flight-control room.
 */
:root {
  --bg: #04060b;
  --bg2: #0a1020;
  --panel: rgba(12, 18, 32, 0.92);
  --panel2: #111a2c;
  --line: #1f2c45;
  --text: #e7eef8;
  --muted: #8d9cb5;
  --accent: #ff9933;
  --cyan: #4cc9f0;
  --plan: #dfe8ff;
  --good: #52d273;
  --warn: #ffcc4d;
  --bad: #ff5c5c;
  --display: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --ts: 1;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: calc(16px * var(--ts)); }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--body); overscroll-behavior: none; }
button, input, select { font: inherit; color: inherit; }
#app { position: relative; max-width: 1100px; height: 100%; margin: 0 auto; overflow: hidden; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding-block: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-bottom)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-y: auto; overflow-x: hidden; }
.screen.full { padding: 0; overflow: hidden; }
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }

h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: -0.01em; margin: 0 0 0.35em; line-height: 1.05; text-wrap: balance; }
h1 { font-size: 2.3rem; font-weight: 800; letter-spacing: -0.02em; text-transform: uppercase; }
h2 { font-size: 1.4rem; }
h3 { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
p { margin: 0 0 0.7em; line-height: 1.5; max-width: 68ch; }
a { color: var(--cyan); }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.mono { font-family: var(--mono); }
.label { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.72rem; color: var(--muted); font-weight: 600; }
.accent { color: var(--accent); }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.spacer { flex: 1; }
.topbar { display: flex; align-items: center; gap: 10px; min-height: 52px; margin-bottom: 6px; }
.topbar h2 { margin: 0; flex: 1; font-size: 1.2rem; letter-spacing: -0.01em; }

.btn { min-height: 48px; min-width: 48px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); cursor: pointer; font-family: var(--display); font-weight: 600; font-size: 0.92rem; letter-spacing: 0.02em; text-transform: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; touch-action: manipulation; }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a0d00; }
.btn.go { background: var(--good); border-color: var(--good); color: #04150a; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.ghost { background: transparent; }
.btn.icon { padding: 0; width: 48px; }
.btn.sm { min-height: 40px; min-width: 40px; padding: 6px 10px; font-size: 0.9rem; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.btn.on { border-color: var(--cyan); color: var(--cyan); }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); font-size: 0.75rem; font-family: var(--display); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }
.chip.isro { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
.chip.nasa { color: var(--cyan); border-color: color-mix(in srgb, var(--cyan) 50%, transparent); }
.stars { color: var(--warn); letter-spacing: 2px; }

/* Home */
.hero { position: relative; min-height: 220px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); margin-bottom: 14px; }

.section { margin: 16px 0 8px; display: flex; align-items: baseline; gap: 10px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.mcard { position: relative; text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: linear-gradient(160deg, var(--panel2), var(--bg2)); cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-height: 150px; overflow: hidden; }
.mcard .yr { font-family: var(--display); font-size: 2.2rem; font-weight: 800; letter-spacing: -0.04em; line-height: 0.9; color: color-mix(in srgb, var(--text) 18%, transparent); position: absolute; right: 12px; top: 10px; }
.mcard .t { font-family: var(--display); font-size: 1.1rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.05; padding-right: 64px; }
.mcard .d { color: var(--muted); font-size: 0.85rem; }
.mcard .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
.diff { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }

/* Mission screens */
.view { position: absolute; inset: 0; }
.view canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.hud-tl { position: absolute; left: max(10px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 6px; z-index: 3; max-width: min(300px, 62vw); pointer-events: none; }
.hud-tl > * { pointer-events: auto; }
.hud-tr { position: absolute; right: max(10px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 6px; align-items: flex-end; z-index: 3; }
.tele { font-family: var(--mono); font-size: 0.78rem; line-height: 1.45; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-variant-numeric: tabular-nums; }
.tele .k { color: var(--muted); }
.tele .v { color: var(--text); float: right; padding-left: 10px; }
.tele .hdr { font-family: var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 600; font-size: 0.8rem; }
.tele .row2 { display: flex; justify-content: space-between; gap: 12px; }
.obj { font-size: 0.82rem; max-width: 260px; }
.obj li { margin: 2px 0; list-style: none; }
.obj ul { padding: 0; margin: 4px 0 0; }
.obj .done { color: var(--good); }
.obj .cur { color: var(--text); }
.obj .todo { color: var(--muted); }
.dock { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; padding: 8px max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); background: linear-gradient(0deg, rgba(4, 6, 11, 0.96), rgba(4, 6, 11, 0.75) 70%, rgba(4, 6, 11, 0)); display: flex; flex-direction: column; gap: 8px; }
.clock { font-family: var(--mono); font-size: 0.85rem; color: var(--cyan); }
.warp { font-family: var(--mono); min-width: 74px; text-align: center; }
.burned { align-self: center; padding: 6px 14px; font-size: 13px; white-space: nowrap; border-radius: 10px; background: var(--panel); border: 1px solid var(--accent); color: var(--accent); font-family: var(--display); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
.editor { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.editor .line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.editor input[type='range'] { flex: 1; min-width: 140px; accent-color: var(--accent); height: 32px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
.seg button { min-height: 40px; min-width: 44px; padding: 6px 10px; border: none; background: transparent; cursor: pointer; font-family: var(--display); font-weight: 600; font-size: 0.82rem; }
.seg button[aria-pressed='true'] { background: var(--cyan); color: #021018; }
.gauge { height: 10px; border-radius: 5px; background: #16203a; position: relative; overflow: hidden; }
.gauge > i { position: absolute; top: 0; bottom: 0; background: var(--good); }
.gauge > b { position: absolute; top: -3px; bottom: -3px; width: 3px; background: #fff; }

/* Lander */
.throttle { position: absolute; right: max(12px, env(safe-area-inset-right)); bottom: 120px; top: 170px; width: 64px; z-index: 4; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.throttle input { writing-mode: vertical-lr; direction: rtl; flex: 1; width: 48px; accent-color: var(--accent); }
.callout { position: absolute; left: 50%; top: 35%; transform: translateX(-50%); z-index: 5; font-family: var(--display); font-size: 2.2rem; font-weight: 700; color: var(--warn); text-shadow: 0 2px 8px #000; letter-spacing: 0.06em; pointer-events: none; }

/* Overlays */
.overlay { position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(2, 4, 8, 0.72); }
.modal { width: min(560px, 100%); max-height: 92%; overflow: auto; background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.toast { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); z-index: 40; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; max-width: 90%; font-size: 0.9rem; box-shadow: 0 8px 30px #000a; }
.busy { position: absolute; inset: 0; z-index: 35; display: flex; align-items: center; justify-content: center; background: rgba(2, 4, 8, 0.5); font-family: var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
.story p { font-size: 1.02rem; }
.spec { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.spec td { padding: 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.spec td:first-child { color: var(--muted); width: 46%; padding-right: 8px; }
.spec td:last-child { font-family: var(--mono); }
.src a { word-break: break-word; }
.chart { width: 100%; height: 220px; border: 1px solid var(--line); border-radius: 10px; background: #070b14; touch-action: none; display: block; }
.big { font-family: var(--display); font-size: 2.2rem; font-weight: 700; }
.ok { color: var(--good); }
.no { color: var(--bad); }
.warnc { color: var(--warn); }
@media (max-width: 520px) {
  h1 { font-size: 2.1rem; }
  .tele { font-size: 0.7rem; }
  .hud-tl { max-width: 58vw; }
}

/* Orbital HUD (phone-first) */
.hud-top { position: absolute; left: 0; right: 0; top: 0; z-index: 3; padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 6px; background: linear-gradient(180deg, rgba(4, 6, 11, 0.92), rgba(4, 6, 11, 0.6) 80%, rgba(4, 6, 11, 0)); padding-bottom: 10px; }
.hud-top .label { font-size: 0.72rem; line-height: 1.1; }
.telegrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px 10px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.telegrid .cell { display: flex; flex-direction: column; min-width: 0; }
.telegrid .k { color: var(--muted); font-size: 0.62rem; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.telegrid .v { color: var(--text); font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.objline { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 10px; padding: 6px 8px; font-size: 0.9rem; }
.objline .steps { font-family: var(--mono); letter-spacing: 2px; }
.objline .steps .done { color: var(--good); }
.objline .steps .cur { color: var(--accent); }
.objline .steps .todo { color: var(--muted); }
.objline .hint { color: var(--muted); font-size: 0.82rem; margin-top: 2px; line-height: 1.35; }
.hud-side { position: absolute; right: max(10px, env(safe-area-inset-right)); top: 46%; transform: translateY(-50%); z-index: 3; display: flex; flex-direction: column; gap: 6px; }
@media (min-width: 760px) { .telegrid { grid-template-columns: repeat(6, minmax(0, 1fr)); } .hud-top { padding-right: 80px; } }

.telegrid .v, .warp { font-variant-numeric: tabular-nums; }
.hero .inner { max-width: 64%; }
@media (max-width: 520px) { .hero .inner { max-width: 70%; } .hero .inner p { font-size: 0.92rem; } }

.screen:not(.full) > * { flex-shrink: 0; }

/* ================= Quick play (joyful layer) ================= */
@keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 153, 51, 0.55); } 50% { box-shadow: 0 0 0 10px rgba(255, 153, 51, 0); } }
@keyframes blink { 50% { opacity: 0.35; } }

/* Home */
.home .hero { min-height: 190px; }
.home .hero h1 { font-size: 2.4rem; }
.tagline { font-size: 0.98rem; color: #d7e0ee; }
.home-toggles { position: absolute; right: 8px; bottom: 8px; z-index: 2; display: flex; gap: 4px; }
.home-toggles .off { opacity: 0.55; }
.play-row { display: flex; gap: 10px; align-items: stretch; margin: 4px 0 6px; }
.play-btn { flex: 1; min-height: 68px; flex-direction: column; gap: 2px; font-size: 1.35rem; font-weight: 800; border-radius: 16px; animation: glow 2.2s infinite; }
.play-btn .small { font-size: 0.85rem; font-weight: 600; opacity: 0.85; }
.star-total { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 86px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel2); }
.star-total .big { font-size: 1.5rem; color: var(--warn); }
.level-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.level-tile { position: relative; text-align: left; border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: linear-gradient(160deg, #15203a, #0a1020); cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-height: 132px; transition: transform 0.12s; }
.level-tile:active { transform: scale(0.97); }
.level-tile.next { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.level-tile.locked { opacity: 0.5; cursor: not-allowed; }
.lt-num { position: absolute; right: 10px; top: 8px; font-weight: 800; color: color-mix(in srgb, var(--text) 35%, transparent); font-size: 1.1rem; }
.lt-icon { font-size: 1.9rem; line-height: 1.1; }
.lt-title { font-weight: 700; font-size: 1rem; line-height: 1.15; }
.lt-mission { color: var(--muted); font-size: 0.78rem; }
.lt-stars { margin-top: auto; color: var(--warn); letter-spacing: 2px; font-size: 1rem; }
.level-tile.locked .lt-stars { color: var(--muted); letter-spacing: 0; font-size: 0.75rem; }
.home-more { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-top: 16px; }

/* Guide (Vyom) */
.guide { display: none; align-items: flex-end; gap: 6px; cursor: pointer; }
.guide.show { display: flex; }
.guide.pop .bubble { animation: pop 0.35s ease-out; }

.bubble { position: relative; background: #f4f7fc; color: #0b1a33; border-radius: 16px 16px 16px 4px; padding: 10px 30px 10px 12px; font-size: 0.98rem; line-height: 1.35; font-weight: 500; max-width: 420px; box-shadow: 0 6px 24px #0008; }
.bubble-next { position: absolute; right: 10px; bottom: 8px; color: #ff9933; font-weight: 800; }
.bubble-go { margin-top: 6px; font-size: 0.8rem; font-weight: 700; color: #d06f00; }
.guide.compact .bubble { font-size: 0.92rem; }
.home > .guide { margin: 0 0 8px; }

/* Play screen */
.play { background: #04060b; touch-action: none; user-select: none; -webkit-user-select: none; }
.play-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.play-top { position: absolute; left: 0; right: 0; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px; padding: max(8px, env(safe-area-inset-top)) 12px 0; }
.play-title { flex: 1; min-width: 0; }
.play-title .lvl { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.play-title .t { font-size: 1.15rem; font-weight: 800; }
.play-goal-stars { color: var(--warn); letter-spacing: 3px; font-size: 1.1rem; opacity: 0.6; }
.play-hud { position: absolute; left: 12px; right: 12px; top: calc(max(8px, env(safe-area-inset-top)) + 50px); z-index: 3; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.play-info { display: flex; gap: 8px; }
.chip-stat { flex: 1; min-width: 0; background: rgba(12, 18, 32, 0.85); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; display: flex; flex-direction: column; }
.chip-stat .k { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.chip-stat .v { font-size: 1.15rem; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fuel { display: flex; align-items: center; gap: 8px; }
.fuel-label { font-size: 0.78rem; font-weight: 700; color: var(--muted); }

.fuel-fill { height: 100%; background: linear-gradient(90deg, #ff9933, #ffcc4d); border-radius: 6px; transition: width 0.1s linear; }

.play-alert { position: absolute; left: 50%; top: 42%; transform: translateX(-50%); z-index: 4; font-weight: 800; font-size: 1.5rem; color: var(--bad); text-shadow: 0 2px 10px #000; pointer-events: none; animation: blink 0.6s infinite; white-space: nowrap; }
.demo-banner { align-self: center; font-size: 0.85rem; background: rgba(76, 201, 240, 0.15); border: 1px solid var(--cyan); color: var(--cyan); border-radius: 999px; padding: 6px 14px; font-weight: 700; white-space: nowrap; }
.play-bottom { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; padding: 10px 14px max(14px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; background: linear-gradient(0deg, rgba(4, 6, 11, 0.95), rgba(4, 6, 11, 0.6) 70%, rgba(4, 6, 11, 0)); }
.big-btn { align-self: center; width: min(320px, 86vw); min-height: 76px; border-radius: 40px; border: none; cursor: pointer; background: radial-gradient(circle at 50% 30%, #ffb05c, #ff8a1f 60%, #d76a00); color: #1a0d00; box-shadow: 0 6px 0 #9a4c00, 0 10px 24px #000a; transition: transform 0.06s, box-shadow 0.06s; touch-action: none; }

.big-btn.pressed { transform: translateY(5px); box-shadow: 0 1px 0 #9a4c00, 0 4px 12px #000a; background: radial-gradient(circle at 50% 30%, #fff1c2, #ffb347 60%, #ff7b00); }
.big-btn[disabled] { filter: grayscale(0.7); opacity: 0.6; }
.aim-row { display: flex; align-items: center; gap: 8px; }
.aim-row input { flex: 1; accent-color: var(--accent); height: 36px; }

/* Results & quiz */
.result-card { animation: pop 0.35s ease-out; }
.result-head { display: flex; gap: 12px; align-items: center; }
.result-head h2 { margin-bottom: 4px; }
.result-head p { margin: 0; }
.star-row { display: flex; gap: 6px; font-size: 2.4rem; line-height: 1; color: #2a3550; }
.star.on.pop { color: var(--warn); animation: pop 0.45s ease-out; text-shadow: 0 0 14px rgba(255, 204, 77, 0.7); }
.result-lines { margin: 12px 0 8px; padding-left: 18px; }
.result-lines li { margin: 2px 0; }
.fact { background: var(--panel2); border-left: 3px solid var(--accent); border-radius: 8px; padding: 8px 10px; font-size: 0.92rem; }
.unlocks { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.unlock { display: flex; gap: 10px; align-items: center; background: rgba(255, 204, 77, 0.08); border: 1px solid rgba(255, 204, 77, 0.4); border-radius: 10px; padding: 8px 10px; animation: pop 0.5s ease-out 1.4s both; }

.confetti { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 31; pointer-events: none; }

/* Badges & rockets */
.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.badge { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--panel2); opacity: 0.55; }
.badge.got { opacity: 1; border-color: rgba(255, 204, 77, 0.55); background: linear-gradient(160deg, #2a2410, #111a2c); }

.skin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.skin { border: 1px solid var(--line); border-radius: 12px; padding: 8px; background: var(--panel2); cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 2px; }

.skin.locked { opacity: 0.5; cursor: not-allowed; }
.skin-prev { width: 100%; height: 80px; display: block; }

.cam-btn { min-height: 36px; font-size: 0.8rem; padding: 4px 10px; background: rgba(12, 18, 32, 0.85); }

/* Vyom everywhere */

.toast { display: flex; align-items: center; gap: 8px; }
.toast-vyom { flex: none; display: flex; }
.modal-vyom { float: right; margin: -4px -4px 4px 8px; }
.toast { width: max-content; max-width: min(92vw, 460px); }

.play-title .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 380px) { .play-title .t { font-size: 1rem; } .big-btn { min-height: 66px; } .big-btn .big-label { font-size: 1.4rem; } }

/* Mission timeline */
.timeline { position: relative; display: flex; flex-direction: column; gap: 10px; padding-left: 0; }
.timeline::before { content: ''; position: absolute; left: 77px; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: linear-gradient(180deg, #4cc9f0, #ff9933 60%, #52d273); opacity: 0.55; }
.tl-era { margin: 8px 0 0 96px; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--cyan); }
.tl-node { position: relative; display: grid; grid-template-columns: 62px 32px 1fr; align-items: center; gap: 0 10px; background: none; border: none; padding: 0; text-align: left; cursor: pointer; color: inherit; }
.tl-node[disabled] { cursor: not-allowed; }
.tl-when { text-align: right; }
.tl-year { font-weight: 800; font-size: 1.05rem; line-height: 1; }
.tl-day { font-size: 0.72rem; color: var(--muted); }
.tl-dot { z-index: 1; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 800; background: #16203a; border: 2px solid var(--line); }
.tl-node.done .tl-dot { background: var(--good); border-color: var(--good); color: #04150a; }
.tl-node.next .tl-dot { background: var(--accent); border-color: var(--accent); color: #1a0d00; animation: glow 2s infinite; }
.tl-card { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; background: linear-gradient(160deg, #15203a, #0a1020); min-width: 0; transition: transform 0.12s; }
.tl-node:active .tl-card { transform: scale(0.98); }
.tl-node.next .tl-card { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.tl-node.locked { opacity: 0.5; }
.tl-icon { width: 38px; height: 38px; flex: none; display: block; }
.tl-text { min-width: 0; }
.tl-title { font-weight: 700; font-size: 1rem; line-height: 1.15; }
.tl-mission { color: var(--muted); font-size: 0.78rem; }
.tl-stars { color: var(--warn); letter-spacing: 2px; font-size: 0.95rem; }
.tl-node.locked .tl-stars { color: var(--muted); letter-spacing: 0; font-size: 0.75rem; }
.quiz-play { width: 100%; justify-content: flex-start; gap: 10px; margin: 2px 0 4px; min-height: 56px; border-color: rgba(76, 201, 240, 0.5); background: linear-gradient(90deg, rgba(76, 201, 240, 0.14), var(--panel2)); text-align: left; }
.qp-ic { font-size: 1.5rem; }
.tl-node.future { opacity: 0.6; cursor: default; }
.tl-node.future .tl-card { border-style: dashed; background: transparent; }
.tl-node.future .tl-stars { color: var(--cyan); letter-spacing: 0; font-size: 0.75rem; }

/* Quiz to Orbit */
.qg-q { position: absolute; left: 12px; right: 64px; top: calc(max(8px, env(safe-area-inset-top)) + 54px); z-index: 3; background: rgba(12, 18, 32, 0.9); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.qg-num { font-size: 0.72rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
.qg-text { font-size: 1.08rem; font-weight: 700; line-height: 1.3; }
.qg-gates { --p: 0; position: absolute; left: 8px; right: 60px; top: calc(28% + var(--p) * 34%); z-index: 3; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; transition: top 0.05s linear; }
.qg-gate { min-height: 64px; border-radius: 16px; border: 2px dashed rgba(76, 201, 240, 0.8); background: rgba(10, 20, 40, 0.85); color: var(--text); font-weight: 700; font-size: 0.9rem; padding: 6px; cursor: pointer; line-height: 1.2; }
.qg-gate.picked { border-style: solid; border-color: var(--accent); background: rgba(255, 153, 51, 0.25); }
.qg-gate.right { border-style: solid; border-color: var(--good); background: rgba(82, 210, 115, 0.35); }
.qg-gate.wrong { border-style: solid; border-color: var(--bad); background: rgba(255, 92, 92, 0.3); }
.qg-meter { position: absolute; right: 12px; top: calc(max(8px, env(safe-area-inset-top)) + 58px); bottom: 110px; z-index: 3; width: 40px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.qg-bar { position: relative; flex: 1; width: 16px; border-radius: 8px; background: #16203a; border: 1px solid var(--line); overflow: visible; }
.qg-fill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 8px; background: linear-gradient(0deg, #ff9933, #ffcc4d); transition: height 0.4s; }
.qg-mark { position: absolute; right: 18px; transform: translateY(50%); font-size: 0.7rem; font-weight: 700; white-space: nowrap; color: var(--good); }
.qg-val { font-size: 0.7rem; font-weight: 700; text-align: center; white-space: nowrap; }
.qg-hearts { font-size: 0.9rem; letter-spacing: 1px; }
.qg-msg { position: absolute; left: 12px; right: 12px; bottom: max(14px, env(safe-area-inset-bottom)); z-index: 4; }
.qg-say { display: flex; gap: 8px; align-items: center; background: #f4f7fc; color: #0b1a33; border-radius: 14px; padding: 8px 12px; font-size: 0.9rem; animation: pop 0.3s; }

/* Solar System explorer */
.sx-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.sx-chip { cursor: pointer; background: var(--panel2); min-height: 34px; text-transform: none; letter-spacing: 0; font-size: 0.82rem; }
.sx-chip.on { border-color: var(--accent); color: var(--accent); }
.sx-tabs { margin: 4px 0 10px; }

.sx-hz { margin-top: 10px; border-color: rgba(82, 210, 115, 0.5); }

/* emoji-free shapes */
.tl-dot svg { color: #c9d4e6; }
.toggle-btn { min-width: 0; padding: 4px 10px; font-size: 0.78rem; min-height: 34px; background: rgba(12, 18, 32, 0.7); }
.toggle-btn.off { opacity: 0.6; }
.qp-ic { width: 30px; height: 30px; border-radius: 50%; flex: none; background: radial-gradient(circle at 35% 35%, #8fdcff, #2a73c9 55%, #0a1f40); box-shadow: 0 0 0 2px rgba(255, 153, 51, 0.8); }
.medal { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.05rem; color: #3a2a00; background: radial-gradient(circle at 35% 30%, #fff1b8, #f2c94c 55%, #b8860b); box-shadow: 0 2px 0 #8a6400; flex: none; }
.medal.off { background: #2a3550; color: #56617a; box-shadow: none; }

.life { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-left: 4px; border: 2px solid #ff5c8a; }

.cam-btn::before { content: 'View '; color: var(--muted); font-weight: 500; }
@media (max-width: 380px) { .cam-btn::before { content: ''; } }

/* Expert mission guide */
.guide-modal { max-height: 90%; }
.guide-steps { display: flex; flex-direction: column; gap: 8px; margin: 6px 0 10px; }
.guide-step { border-left: 3px solid var(--accent); background: var(--panel2); border-radius: 8px; padding: 8px 10px; line-height: 1.45; }

.play-title .t.long { font-size: 0.98rem; }
@media (max-width: 380px) { .play-title .t.long { font-size: 0.86rem; } }

/* ---------- v8: filters, era themes, mission cards ---------- */
[hidden] { display: none !important; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 2px; }
.pill { border: 1px solid var(--line); background: var(--panel2); color: var(--text); border-radius: 999px; padding: 7px 14px; font-size: 0.85rem; font-weight: 600; cursor: pointer; min-height: 36px; transition: background 0.15s, border-color 0.15s; }
.pill[aria-pressed='true'] { background: var(--accent); border-color: var(--accent); color: #1a0d00; }
.filter-count { text-transform: none; letter-spacing: 0; }
.tl-row { position: relative; }
.tl-row > .tl-node { width: 100%; }
.tl-row .tl-card { padding-right: 48px; }
.tl-info { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: #0d1628; color: var(--cyan); font-weight: 800; font-style: italic; font-family: Georgia, serif; font-size: 1rem; cursor: pointer; z-index: 2; }
.tl-info:hover, .tl-info:focus-visible { border-color: var(--cyan); }
/* era themes */
.tl-era[data-era='classic'] { color: #e8b04b; }
.tl-row[data-era='classic'] .tl-card { border-color: #5a4423; background: repeating-linear-gradient(0deg, rgba(232, 176, 75, 0.05) 0 1px, transparent 1px 3px), linear-gradient(160deg, #241a0d, #0f0b06); }
.tl-row[data-era='classic'] .tl-year { color: #f0c46d; }
.tl-era[data-era='explorer'] { color: var(--cyan); }
.tl-row[data-era='explorer'] .tl-card { border-color: #1d4a63; background: linear-gradient(rgba(76, 201, 240, 0.06) 1px, transparent 1px) 0 0 / 14px 14px, linear-gradient(90deg, rgba(76, 201, 240, 0.06) 1px, transparent 1px) 0 0 / 14px 14px, linear-gradient(160deg, #0b2233, #071420); }
.tl-row[data-era='explorer'] .tl-year { color: #8fe3ff; }
.tl-era[data-era='modern'] { color: #ffd166; }
.tl-row[data-era='modern'] .tl-card { border-color: rgba(255, 209, 102, 0.45); background: linear-gradient(160deg, rgba(64, 120, 255, 0.18), rgba(10, 16, 32, 0.85)); box-shadow: 0 0 18px rgba(64, 120, 255, 0.12) inset; backdrop-filter: blur(6px); }
.tl-row[data-era='modern'] .tl-year { color: #ffd166; }
.tl-row .tl-node.next .tl-card { border-color: var(--accent); }
.tl-era[data-era='future'] { color: var(--muted); }
/* mission card */
.mission-card { display: flex; flex-direction: column; gap: 12px; }
.mc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.mc-head h2 { margin: 2px 0; }
.mc-sec { border-top: 1px solid var(--line); padding-top: 10px; }
.mc-k { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
.mc-v { line-height: 1.4; }
.mc-params { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 8px 0 0; font-size: 0.9rem; }
.mc-params dt { color: var(--muted); }
.mc-params dd { margin: 0; font-weight: 600; }
.star-targets { list-style: none; padding: 0; margin: 4px 0 0; display: flex; flex-direction: column; gap: 6px; }
.star-targets li { display: flex; gap: 10px; align-items: baseline; color: var(--muted); font-size: 0.92rem; }
.star-targets li .st { color: #4a5670; letter-spacing: 1px; min-width: 3.4em; }
.star-targets li.got { color: var(--text); }
.star-targets li.got .st { color: var(--warn); }
.fact.locked-card { opacity: 0.75; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* debrief */
.debrief { border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px 10px; background: rgba(10, 16, 32, 0.6); }
.debrief > summary { cursor: pointer; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 4px 0; }
.debrief[open] > summary { margin-bottom: 6px; }
.debrief-sec { margin: 8px 0; }
.debrief-graph-wrap { margin: 4px 0 6px; }
.debrief-graph { display: block; width: 100%; height: 96px; }
.graph-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.78rem; margin-bottom: 4px; }
.graph-legend span::before { content: ''; display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.lg-a::before { background: #ff9933; }
.lg-b::before { background: #4cc9f0; }
.graph-axis { display: flex; justify-content: space-between; margin-top: 2px; }
.coach { border-left: 3px solid var(--cyan); background: rgba(76, 201, 240, 0.08); padding: 8px 12px; border-radius: 0 10px 10px 0; line-height: 1.45; font-size: 0.95rem; }
.result-card .result-btns { position: sticky; bottom: -18px; background: var(--bg2); padding: 10px 0 4px; margin-bottom: -4px; }
.medal.card { background: linear-gradient(160deg, #f5e6c8, #8b5a2b); }
/* history cards */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; margin-bottom: 18px; }
.hcard { border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; background: var(--panel2); opacity: 0.6; }
.hcard.got { opacity: 1; border-color: #8b5a2b; background: linear-gradient(160deg, #241a0d, #111a2c); }
.hcard summary { cursor: pointer; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.hc-year { font-weight: 800; color: var(--warn); }
.hc-name { font-weight: 700; }
.hcard p { margin: 8px 0 2px; }
/* ---------- orbit sandbox ---------- */
.sb-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.sb-stats .chip-stat { padding: 4px 8px; }
.sb-stats .chip-stat .v { font-size: 0.9rem; }
.sb-msg { pointer-events: auto; }
.sb-controls { display: flex; flex-direction: column; gap: 8px; }
.sb-tip { display: flex; align-items: center; gap: 8px; background: rgba(12, 18, 32, 0.9); border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px; font-size: 0.85rem; line-height: 1.35; }
.sb-tip > span:nth-child(2) { flex: 1; min-width: 0; }
.sb-small { justify-content: center; gap: 6px; }
.sb-big { display: flex; gap: 12px; justify-content: center; }
.sb-big .big-btn { width: min(170px, 42vw); min-height: 64px; }
.sb-big .big-btn .big-label { font-size: 1.25rem; }
.sb-big .big-btn[data-testid='sb-brake'] { background: radial-gradient(circle at 50% 30%, #9fdcff, #4cc9f0 60%, #1f8fb8); box-shadow: 0 6px 0 #146485, 0 10px 24px #000a; }
.sb-setup { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; max-height: 72%; overflow-y: auto; background: var(--bg2); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; padding: 14px 16px max(16px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
.sb-setup .filters { margin: 0; }
.sb-slider { display: flex; flex-direction: column; gap: 4px; }
.sb-lab { display: flex; justify-content: space-between; gap: 10px; font-size: 0.85rem; color: var(--muted); }
.sb-val { color: var(--text); font-weight: 700; text-align: right; }
.sb-slider input { width: 100%; accent-color: var(--accent); }
.sb-preview { margin: -4px 0 0; }
@media (max-width: 420px) { .sb-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } .sb-stats .chip-stat .k { font-size: 0.58rem; } .sb-stats .chip-stat .v { font-size: 0.78rem; } }
.mission-card-ov { position: fixed; }
/* two-control levels */
.dual-btns { display: flex; gap: 12px; justify-content: center; }
.dual-btns .big-btn { width: min(170px, 43vw); min-height: 70px; }
.dual-btns .big-btn .big-label { font-size: 1.15rem; letter-spacing: 0.04em; }
.big-btn.btn-b { background: radial-gradient(circle at 50% 30%, #9fdcff, #4cc9f0 60%, #1f8fb8); box-shadow: 0 6px 0 #146485, 0 10px 24px #000a; }
.big-btn.btn-b.pressed { transform: translateY(5px); box-shadow: 0 1px 0 #146485, 0 4px 12px #000a; background: radial-gradient(circle at 50% 30%, #e6f7ff, #8fe3ff 60%, #4cc9f0); }
.aim-label { font-weight: 700; font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
/* quiz hints */
.hint-row { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin: -4px 0 8px; }
.quiz-hint, .qg-hint { color: var(--warn); font-size: 0.92rem; line-height: 1.4; }
.qg-hint:empty, .quiz-hint:empty { display: none; }
.qg-num .hint-btn { margin-left: 10px; padding: 2px 10px; min-height: 28px; font-size: 0.78rem; }
.qg-num { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
/* Vyom live coaching */
.coach-tip { position: absolute; left: 50%; transform: translate(-50%, 8px); bottom: calc(200px + env(safe-area-inset-bottom)); z-index: 5; display: flex; align-items: center; gap: 8px; max-width: min(92%, 420px); background: rgba(12, 18, 32, 0.95); border: 1px solid var(--cyan); border-radius: 14px; padding: 6px 12px 6px 6px; font-weight: 700; font-size: 0.98rem; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; }
.coach-tip.show { opacity: 1; transform: translate(-50%, 0); }
.praise { font-weight: 800; color: var(--warn); font-size: 1.05rem; }
.home-toggles { left: 8px; flex-wrap: wrap; justify-content: flex-end; }
.countdown { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 6; font-size: 5rem; font-weight: 900; color: var(--accent); text-shadow: 0 4px 24px #000; pointer-events: none; }
.countdown.pop { animation: cdpop 0.42s ease-out; }
@keyframes cdpop { from { transform: translate(-50%, -50%) scale(1.8); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
.rank-card { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--panel2); border-radius: 14px; padding: 10px 12px; margin: 8px 0 4px; }
.rank-card .rk-name { font-weight: 800; }
.rank-bar { height: 6px; border-radius: 3px; background: #1a2440; overflow: hidden; margin-top: 5px; }
.rank-bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--warn)); }
.rank-card .grow { flex: 1; min-width: 0; }
.daily-chip { display: inline-block; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: #1a0d00; background: var(--warn); border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; }
.daily-card { border: 1px solid var(--warn); background: linear-gradient(160deg, rgba(255,204,77,0.12), rgba(10,16,32,0.9)); border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; text-align: left; color: inherit; width: 100%; margin: 6px 0; }
.daily-card .grow { flex: 1; min-width: 0; }
/* toggles: their own row under the title, so they never cover the text */
.hero .home-toggles { position: static; display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 6px; margin-top: 10px; }
.fly-ov { position: absolute; inset: 0; z-index: 40; background: #04060b; cursor: pointer; }
.fly-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.fly-skip { position: absolute; right: 14px; bottom: max(14px, env(safe-area-inset-bottom)); color: var(--muted); }
.ver-chip { display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 6px; border: 1px solid var(--line); background: rgba(12, 18, 32, 0.8); color: var(--text); font-size: 0.7rem; letter-spacing: 0.04em; text-transform: none; vertical-align: middle; }
/* profile and certificates */
.pf-form { display: flex; flex-direction: column; gap: 10px; margin: 8px 0; }
.pf-field { display: flex; flex-direction: column; gap: 4px; }
.pf-label { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
.pf-input { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 1rem; }
.pf-input:focus { outline: 2px solid var(--accent); border-color: transparent; }
.pf-err { color: var(--bad); font-size: 0.9rem; }
.pf-err:empty { display: none; }
.pf-card { display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--panel2); border-radius: 14px; padding: 10px 12px; margin: 6px 0 10px; }
.cert-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin: 10px 0 14px; }
.cert-card { display: flex; gap: 12px; align-items: center; text-align: left; color: inherit; border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--panel2); cursor: pointer; opacity: 0.6; }
.cert-card.got { opacity: 1; border-color: var(--tier); box-shadow: 0 0 0 1px var(--tier) inset; }
.cert-card[disabled] { cursor: default; }
.cert-modal { width: min(980px, 100%); }
.cert-canvas { display: block; width: 100%; height: auto; border-radius: 8px; box-shadow: 0 6px 24px #0008; }
.cert-unlock { text-align: left; color: inherit; cursor: pointer; width: 100%; }
.vf { border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; margin: 6px 0 12px; background: var(--panel2); }
.vf > summary { cursor: pointer; font-weight: 700; }
.vf-ok { color: var(--good); line-height: 1.45; }
.vf-bad { color: var(--bad); line-height: 1.45; }

/* ---------- pages: menu tiles, rank, profile, settings, intro, tours, demos ---------- */
.settings-chip { margin-top: 10px; min-height: 36px; background: rgba(12, 18, 32, 0.7); }
.menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 14px; }
.menu-tile { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; padding: 12px; min-height: 104px; border-radius: 14px; border: 1px solid var(--line); background: linear-gradient(160deg, var(--panel2), var(--bg2)); color: var(--text); cursor: pointer; font: inherit; touch-action: manipulation; transition: transform 0.12s, border-color 0.12s; }
.menu-tile:hover, .menu-tile:focus-visible { border-color: var(--accent); transform: translateY(-1px); }
.menu-tile b { font-family: var(--display); font-size: 0.98rem; }
.mt-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); margin-bottom: 4px; }
.mt-ic svg { width: 22px; height: 22px; fill: currentColor; stroke: currentColor; stroke-width: 0; }
.mt-ic svg path[fill='none'], .mt-ic svg ellipse[fill='none'] { stroke-width: 1.8; }
button.rank-card { width: 100%; text-align: left; color: var(--text); font: inherit; cursor: pointer; }
.rank-card { border-color: color-mix(in srgb, var(--tier, var(--accent)) 45%, var(--line)); background: linear-gradient(120deg, color-mix(in srgb, var(--tier, var(--accent)) 14%, var(--panel2)), var(--panel2) 60%); }
.rank-card .emblem { flex: none; line-height: 0; filter: drop-shadow(0 2px 6px color-mix(in srgb, var(--tier) 45%, transparent)); }
.rank-card .rk-name { font-family: var(--display); font-size: 1.15rem; color: var(--tier, var(--text)); }
.rank-card.big { padding: 14px; margin: 10px 0; }
.rank-card.big .rk-name { font-size: 1.4rem; }
.rank-card .rank-bar > div { background: var(--tier, var(--accent)); }
.rank-stars { display: inline-flex; gap: 2px; font-size: 1rem; letter-spacing: 0; margin: 1px 0 2px; }
.rank-stars span { color: #2a3a5c; }
.rank-stars span.on { color: var(--tier, var(--warn)); text-shadow: 0 0 6px color-mix(in srgb, var(--tier, var(--warn)) 60%, transparent); }
.rank-ladder { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-direction: column-reverse; gap: 6px; }
.rank-ladder li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); opacity: 0.55; }
.rank-ladder li.got { opacity: 1; }
.rank-ladder li.cur { border-color: var(--tier); box-shadow: 0 0 0 1px var(--tier) inset; }
.rank-ladder li b { color: var(--tier); font-family: var(--display); }
.rank-ladder .emblem { line-height: 0; }
.rank-ladder li:not(.got) .emblem { filter: grayscale(1); }
.rank-ladder li.pulse { animation: lw-pulse 1.6s ease-out 2; }
@keyframes lw-pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--tier) 70%, transparent); } 100% { box-shadow: 0 0 0 14px transparent; } }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin: 6px 0 4px; }
.stat-grid .stat { border: 1px solid var(--line); background: var(--panel2); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; }
.stat-grid .stat b { font-family: var(--display); font-size: 1.2rem; }
.set-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--panel2); }
.set-row { display: flex; align-items: center; gap: 12px; padding: 12px; border-top: 1px solid var(--line); }
.set-row:first-child { border-top: none; }
.set-row.col { flex-direction: column; align-items: flex-start; }
.set-row .grow { flex: 1; min-width: 0; }
.set-row .seg button.on { background: var(--accent); color: #1a0d00; }
.switch { flex: none; width: 54px; height: 32px; border-radius: 16px; border: 1px solid var(--line); background: #1a2440; position: relative; cursor: pointer; padding: 0; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--muted); transition: transform 0.15s, background 0.15s; }
.switch[aria-checked='true'] { background: color-mix(in srgb, var(--accent) 40%, #1a2440); border-color: var(--accent); }
.switch[aria-checked='true']::after { transform: translateX(22px); background: var(--accent); }
.btn.danger { border-color: #ff6b6b; color: #ff8f8f; }
.screen.intro { justify-content: center; gap: 14px; max-width: 560px; margin: 0 auto; }
.intro-top { display: flex; justify-content: space-between; align-items: center; position: absolute; top: max(12px, env(safe-area-inset-top)); left: 16px; right: 16px; }
.intro-card { text-align: center; padding: 18px 8px; }
.intro-card.in { animation: lw-in 0.35s ease-out; }
@keyframes lw-in { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
.intro-art { min-height: 132px; display: grid; place-items: center; margin-bottom: 8px; }
.intro-art > svg { width: min(260px, 80%); height: auto; }
.intro-title { font-size: 1.5rem; margin: 6px 0; }
.intro-text { color: var(--muted); font-size: 1.02rem; line-height: 1.5; margin: 0 auto; max-width: 440px; }
.intro-emblems { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 300px; }
.intro-pages { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 300px; }
.intro-dots { display: flex; justify-content: center; gap: 8px; }
.intro-dots .dot { width: 10px; height: 10px; min-width: 0; padding: 0; border-radius: 50%; border: none; background: #2a3a5c; cursor: pointer; }
.intro-dots .dot[aria-selected='true'] { background: var(--accent); width: 24px; border-radius: 5px; }
.intro-btns { gap: 8px; }
.tour { position: fixed; inset: 0; z-index: 90; }
.tour.dim { background: rgba(2, 4, 10, 0.7); }
.tour-ring { position: fixed; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(2, 4, 10, 0.7), 0 0 0 2px var(--accent); transition: all 0.25s ease; pointer-events: none; }
.tour-bubble { position: fixed; background: var(--bg2); border: 1px solid var(--accent); border-radius: 14px; padding: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
.tour-head { display: flex; gap: 8px; align-items: center; }
.tour-vyom { line-height: 0; flex: none; }
.tour-title { display: block; font-family: var(--display); font-size: 1.05rem; }
.tour-text { margin: 8px 0 10px; line-height: 1.45; }
.tour-btns { display: flex; gap: 6px; align-items: center; }
.tour-btns .grow { flex: 1; }
.demo-banner { display: inline-flex; align-items: center; gap: 8px; white-space: normal; }
.demo-skip { min-height: 32px; padding: 4px 12px; background: var(--cyan); color: #021018; border-color: var(--cyan); pointer-events: auto; }
.auto-demo { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border: 1px solid var(--cyan); background: rgba(76, 201, 240, 0.1); border-radius: 12px; padding: 8px 10px; margin: 8px 0; }
.auto-demo .grow { flex: 1; min-width: 150px; }
.auto-demo-bar { height: 4px; border-radius: 2px; background: #1a2440; margin-top: 5px; overflow: hidden; }
.auto-demo-fill { height: 100%; width: 100%; background: var(--cyan); }
body.reduce-motion .intro-card.in, body.reduce-motion .rank-ladder li.pulse { animation: none; }
.rank-up { animation: lw-in 0.5s ease-out; }
.caution-card { border-color: #ffb020; box-shadow: 0 0 0 1px #ffb020 inset, 0 20px 50px rgba(0, 0, 0, 0.6); }
.caution-head { display: flex; align-items: center; gap: 12px; }
.caution-head h2 { margin: 0; }
.caution-label { font-family: var(--display); font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #ffb020; font-size: 0.8rem; }
.caution-list { list-style: none; padding: 0; margin: 8px 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.caution-list li { border: 1px solid #5a3a14; background: rgba(255, 176, 32, 0.07); border-radius: 10px; padding: 6px 9px; display: flex; flex-direction: column; }
.caution-list b { color: #ffcf70; font-family: var(--display); }
.caution-list span { font-size: 0.8rem; color: var(--muted); }
.caution-tick { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); cursor: pointer; margin-top: 4px; }
.caution-tick input { width: 22px; height: 22px; accent-color: #ff6b6b; flex: none; }
.btn.danger-solid { background: #c62828; border-color: #c62828; color: #fff; }
.btn.danger-solid:disabled { opacity: 0.4; cursor: not-allowed; }
/* rank-up celebration */
.rank-up-ov { position: fixed; inset: 0; z-index: 95; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--tier) 30%, #04060b) 0%, #04060b 62%); overflow: hidden; cursor: pointer; animation: ru-fade 0.3s ease-out; }
.rank-up-ov.out { opacity: 0; transition: opacity 0.28s; }
@keyframes ru-fade { from { opacity: 0; } }
.ru-rays { position: absolute; left: 50%; top: 42%; width: 900px; height: 900px; margin: -450px 0 0 -450px; background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--tier) 26%, transparent) 0deg 8deg, transparent 8deg 22deg); border-radius: 50%; mask: radial-gradient(circle, #000 10%, transparent 62%); -webkit-mask: radial-gradient(circle, #000 10%, transparent 62%); opacity: 0; transform: scale(0.4); transition: opacity 0.6s, transform 0.8s cubic-bezier(0.2, 1.4, 0.4, 1); }
.rank-up-ov.s2 .ru-rays { opacity: 1; transform: scale(1); animation: ru-spin 14s linear infinite; }
@keyframes ru-spin { to { rotate: 360deg; } }
.ru-burst { position: absolute; left: 50%; top: 42%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: radial-gradient(circle, #fff8d6 0%, #ffd700 35%, #f2a900 65%, rgba(242, 169, 0, 0) 100%); opacity: 0; }
.rank-up-ov.s2 .ru-burst { animation: ru-burst 0.7s ease-out; }
@keyframes ru-burst { 0% { opacity: 1; transform: scale(0.2); } 40% { opacity: 0.9; } 100% { opacity: 0; transform: scale(16); } }
.ru-stage { position: relative; width: 170px; height: 170px; display: grid; place-items: center; }
.ru-stage > div { position: absolute; line-height: 0; }
.ru-old { transition: transform 0.6s ease-in, opacity 0.6s ease-in, filter 0.6s; }
.rank-up-ov.s1 .ru-old { transform: translateY(-70px) scale(0.6); opacity: 0; filter: grayscale(1) blur(2px); }
.ru-new { opacity: 0; transform: scale(2.4); filter: drop-shadow(0 0 22px var(--tier)); }
.rank-up-ov.s2 .ru-new { animation: ru-land 0.55s cubic-bezier(0.3, 1.6, 0.5, 1) forwards, ru-glow 2.4s ease-in-out 0.6s infinite; }
@keyframes ru-land { 0% { opacity: 0; transform: scale(2.4); } 60% { opacity: 1; transform: scale(0.92); } 100% { opacity: 1; transform: scale(1); } }
@keyframes ru-glow { 50% { filter: drop-shadow(0 0 34px var(--tier)); } }
.ru-label, .ru-name, .ru-from, .rank-up-ov .rank-stars, .ru-tap { position: relative; opacity: 0; transform: translateY(10px); transition: opacity 0.4s, transform 0.4s; }
.rank-up-ov.s2 .ru-label, .rank-up-ov.s2 .ru-name, .rank-up-ov.s2 .ru-from, .rank-up-ov.s2 .rank-stars { opacity: 1; transform: none; }
.rank-up-ov.s2 .ru-name { transition-delay: 0.25s; }
.rank-up-ov.s2 .ru-from { transition-delay: 0.4s; }
.rank-up-ov.s3 .ru-tap { opacity: 1; transform: none; }
@keyframes ru-blink { 50% { opacity: 0.35; } }
.ru-label { font-family: var(--display); font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: var(--tier); font-size: 0.85rem; margin-top: 10px; }
.ru-name { font-family: var(--display); font-weight: 800; font-size: clamp(1.8rem, 8vw, 2.6rem); text-align: center; text-shadow: 0 0 18px color-mix(in srgb, var(--tier) 60%, transparent); padding: 0 16px; }
.ru-from { color: var(--muted); font-size: 0.9rem; }
.rank-up-ov .rank-stars { font-size: 1.9rem; gap: 6px; margin-top: 4px; }
.rank-stars span.pop { animation: ru-pop 0.35s cubic-bezier(0.3, 1.8, 0.5, 1); display: inline-block; }
@keyframes ru-pop { 0% { transform: scale(0.3); } 100% { transform: scale(1); } }
.ru-tap { margin-top: 18px; font-size: 0.85rem; }
.rank-up-ov.calm *, .rank-up-ov.calm { animation: none !important; transition: none !important; }
.rank-up-ov.calm .ru-old { display: none; }
.rank-up-ov.calm .ru-new, .rank-up-ov.calm .ru-rays { opacity: 1; transform: none; }
.rank-up-ov .ru-btn { position: relative; margin-top: 18px; min-width: 180px; background: rgba(12, 18, 32, 0.8); transition: background 0.3s, color 0.3s; }
.rank-up-ov .ru-btn.primary { background: var(--accent); color: #1a0d00; }
.mc-learn { margin: 2px 0 0; padding-left: 18px; font-size: 0.9rem; } .mc-learn li { margin-bottom: 3px; }

<script>(()=>{var Hn=[{id:"apollo11",kind:"lander",agency:"NASA",year:1969,date:"1969-07-20T20:17:40Z",title:"Apollo 11: The Eagle Has Landed",craft:"Lunar Module Eagle (LM-5)",crew:"Neil Armstrong, Buzz Aldrin (Michael Collins in orbit aboard Columbia)",difficulty:1,story:["20 July 1969. Eagle is descending toward the Sea of Tranquility when the guidance computer flashes program alarms 1202 and 1201. Mission Control decides it's safe to continue.","Close to the surface, Neil Armstrong sees that the computer is steering them into a boulder field around a crater. He takes semi-manual control and flies on, looking for a clear spot.",`In Houston, Charlie Duke calls out fuel: "60 seconds"\u2026 "30 seconds". That's the time left before they must land or abort.`],goal:"Fly past the boulder field and touch down gently before you run out of fuel.",physics:{g:1.62,engine:{name:"Descent Propulsion System",thrust:45040,isp:305,minThrottle:.1,maxThrottle:.6},mass:7600,dryMass:6930,start:{x:-120,z:152,vx:13,vz:-4,pitch:-10},pitchRate:10,maxPitch:45,limits:{vz:3,vx:1.2,tilt:12},footprint:4.5,bingoReserveSeconds:20,callouts:[60,30],target:{x0:300,x1:520},terrain:{base:0,craters:[{x:120,r:90,depth:18,rim:3},{x:420,r:8,depth:1.2,rim:.3},{x:610,r:30,depth:5,rim:1}],boulders:[{x:20,r:2.5},{x:45,r:3},{x:70,r:2},{x:95,r:4},{x:150,r:3.5},{x:175,r:2.5},{x:200,r:3},{x:228,r:2},{x:255,r:2.5},{x:560,r:2.5},{x:585,r:3}]},surface:"moon"},history:'Eagle touched down at 20:17:40 UTC on 20 July 1969, a few hundred metres beyond West crater. Post-flight analysis estimated roughly 45 seconds of fuel remained before the abort deadline, more than the "30 seconds" called at the time, because propellant sloshing had fooled the low-level sensor.',facts:["The descent engine was the first throttleable rocket engine flown in space.","Lunar gravity is about one-sixth of Earth's, so hovering burns far less fuel than it would on Earth."],sources:[{title:"Descent propulsion system (thrust, throttle range, Isp)",url:"https://en.wikipedia.org/wiki/Descent_propulsion_system"},{title:"NASA: 50 Years Ago, One Small Step",url:"https://www.nasa.gov/feature/50-years-ago-one-small-step-one-giant-leap"}],approximate:["Lander mass and fuel at the start of this final approach are estimates for gameplay; the engine figures are the real DPS values."]},{id:"apollo13",kind:"orbital",agency:"NASA",year:1970,date:"1970-04-14T03:08:00Z",title:"Apollo 13: Get Them Home",craft:"Odyssey (CSM) + Aquarius (LM)",crew:"Jim Lovell, Jack Swigert, Fred Haise",difficulty:3,story:["14 April 1970, 55 h 54 min into the flight. An oxygen tank in the Service Module explodes. The Moon landing is off; now the only goal is getting three astronauts home alive.",`The ship is on a "hybrid" trajectory that skims about 110 km above the Moon and would then miss Earth completely. The crew must burn the Lunar Module's descent engine to get back onto a free-return path, one where the Moon's gravity swings them home.`,"They must hit Earth's atmosphere at just the right angle. Too steep and they burn up; too shallow and they skip off into space."],goal:"Burn the LM descent engine to reach Earth's entry corridor: \u22127.4\xB0 to \u22125.3\xB0 at 121.9 km altitude.",physics:{central:"earth",perturbers:["moon","sun"],span:6,ship:{name:"Apollo 13 stack (LM descent engine)",wetMass:44e3,dryMass:35800,engine:{name:"LM Descent Propulsion System",thrust:18016,isp:305}},entryInterface:{body:"earth",altitude:121920,stop:!0},corridor:[-7.4,-5.3]},history:'At 61 h 29 min the crew burned the LM descent engine for about 35 s (\u2248 11.6 m/s) to restore a free return. After swinging around the Moon they made the "PC+2" burn (\u2248 262 m/s) to speed the trip home. Odyssey splashed down in the Pacific on 17 April 1970.',facts:["The burn was done with the Lunar Module steering the whole docked stack, something it was never designed for.","Apollo 13 holds the record for the farthest humans have travelled from Earth."],sources:[{title:"NASA Apollo Flight Journal: Apollo 13",url:"https://www.nasa.gov/history/afj/ap13fj/11day3-minimise-power.html"},{title:"Apollo 13 entry and trajectory notes (NASA NTRS)",url:"https://ntrs.nasa.gov/api/citations/20090026451/downloads/20090026451.pdf"}],approximate:["Stack mass, remaining DPS propellant and the throttle (40%) are approximations. Because this game is 2D, the corrective burn needed differs from the real 11.6 m/s."],stageText:{freeReturn:{title:"Back to free return",hint:"Make a small burn so the predicted path enters Earth\u2019s atmosphere between \u22127.4\xB0 and \u22125.3\xB0. Watch the entry gauge."},pc2:{title:"PC+2 burn (bonus)",hint:"After passing the Moon, make a 262 m/s burn that brings the crew home sooner, still inside the corridor."}}},{id:"voyager2",kind:"orbital",agency:"NASA / JPL",year:1979,date:"1979-03-01T00:00:00Z",title:"Voyager 2: The Grand Tour",craft:"Voyager 2",crew:"Uncrewed",difficulty:3,story:["In the late 1970s the outer planets lined up in a way that happens only once every 175 years. Voyager 2 can use Jupiter's gravity as a slingshot to reach Saturn, and later Uranus and Neptune.","It's March 1979. Voyager 2 is closing in on Jupiter, but its aim is slightly off. A small trajectory correction now decides whether Jupiter flings it to Saturn or off into empty space."],goal:"Make a correction burn so that Jupiter's gravity assist sends Voyager 2 within 1,000,000 km of Saturn.",physics:{central:"sun",perturbers:["jupiter","saturn"],span:1e3,ship:{name:"Voyager 2",wetMass:722,dryMass:690,engine:{name:"Hydrazine thrusters",thrust:89,isp:220}},saturnTargetKm:1e6},history:"Voyager 2 passed Jupiter on 9 July 1979 (about 570,000 km above the clouds) and Saturn on 26 August 1981. It went on to become the only spacecraft to visit Uranus (1986) and Neptune (1989).",facts:["A gravity assist steals a tiny bit of a planet's orbital energy. Jupiter slowed down by an immeasurably small amount.","Voyager 2 is now in interstellar space, more than 20 billion km from Earth."],sources:[{title:"Voyager 2 flyby dates and distances",url:"https://www.universetoday.com/articles/voyager-2"},{title:"NASA: Voyager mission",url:"https://science.nasa.gov/mission/voyager/"}],approximate:["Spacecraft mass and thruster figures are approximate. The flyby distances and dates come from a trajectory designed to match the real ones in this 2D model."],stageText:{aim:{title:"Correct course",hint:"A tiny burn now shifts where you pass Jupiter, and that changes everything after. Get the predicted Saturn approach under 1,000,000 km."},saturn:{title:"Reach Saturn",hint:"Fly through the Jupiter gravity assist all the way to Saturn."}}},{id:"mangalyaan",kind:"orbital",agency:"ISRO",year:2014,date:"2013-11-05T09:08:00Z",title:"Mangalyaan: Mars on the First Try",craft:"Mars Orbiter Mission (MOM)",crew:"Uncrewed",difficulty:2,story:["India's first interplanetary mission had a tight budget and a small rocket. The PSLV couldn't throw the spacecraft straight to Mars, so ISRO raised its orbit around Earth six times before the final push.","Launch windows to Mars open only once every 26 months. Pick the departure date and travel time that the spacecraft's fuel can afford.","Then, ten months later, the 440 N main engine must fire for about 23 minutes at Mars, and it hasn't run for 300 days. Too little and Mangalyaan sails past Mars forever."],goal:"Choose a launch window, aim for Mars, and fire the engine to enter Mars orbit (periapsis 300\u2013800 km).",physics:{central:"sun",perturbers:["earth","mars","jupiter","venus"],span:360,ship:{name:"Mars Orbiter Mission",wetMass:845,dryMass:482.5,engine:{name:"440 N Liquid Apogee Motor",thrust:440,isp:315}},massBeforeTMI:1012,preTMIorbitKm:[248,192874],window:{departFrom:"2013-10-20",departTo:"2014-01-20",tofMin:200,tofMax:360},captureKm:{periMin:300,periMax:800,apoMax:1e5}},history:"Launched on 5 November 2013 on PSLV-C25, Mangalyaan left Earth on 1 December 2013 and fired its engine for 1,388.67 s on 24 September 2014. It entered a 421.7 \xD7 76,993.6 km Mars orbit, making India the first nation to reach Mars orbit on its first attempt.",facts:["The Mars Orbiter Mission was famously cheaper than the film Gravity.","MOM's orbit took 72 hours 51 minutes, which is why its photos could capture the whole disc of Mars."],sources:[{title:"Mars Orbiter Mission (masses, burns, orbit)",url:"https://en.wikipedia.org/wiki/Mars_Orbiter_Mission"}],approximate:["Mass after the Earth-orbit raising burns (1,012 kg) is an estimate. The LAM specific impulse (315 s) is approximate."],stageText:{tcm:{title:"Trajectory correction",hint:"Months before arrival, a small burn moves your closest approach to Mars to 300\u2013800 km altitude."},moi:{title:"Mars orbit insertion",hint:"At closest approach, burn retrograde relative to Mars for about 20+ minutes. Too short and you fly past Mars forever."}}},{id:"perseverance",kind:"edl",agency:"NASA / JPL",year:2021,date:"2021-02-18T20:55:00Z",title:"Perseverance: Seven Minutes of Terror",craft:"Mars 2020 (Perseverance rover)",crew:"Uncrewed",difficulty:2,story:["18 February 2021. Perseverance hits the top of Mars's atmosphere at about 19,500 km/h. Radio signals take over 11 minutes to reach Earth, so everything happens on its own.","The capsule rolls its lift up or down to steer. When it has slowed enough, the supersonic parachute opens, and that only works within a narrow window.","Finally the descent stage fires its rockets and lowers the rover on cables: the sky crane."],goal:"Steer the entry, open the parachute in its safe window, then fly the descent stage to a safe spot in Jezero Crater.",physics:{entry:{alt:125e3,v:5420,gammaDeg:-15.5,mass:3440},aero:{cd:1.65,area:15.9,ld:.24,noseRadius:1.125},chute:{cd:.62,area:363,maxMach:2.2,minMach:1.1,maxQ:850,shieldSepDelay:20,shieldMass:440},backshellAlt:2100,targetDownrange:65e4,ellipseKm:7.7,lander:{g:3.721,engine:{name:"8 \xD7 Mars Landing Engine",thrust:24800,isp:220,minThrottle:.13,maxThrottle:1},mass:2100,dryMass:1700,pitchRate:25,maxPitch:45,limits:{vz:1,vx:.5,tilt:15},footprint:2,skycraneAlt:20,skycraneSpeed:.75,terrain:{base:0,craters:[{x:300,r:60,depth:10,rim:2},{x:900,r:40,depth:7,rim:1.5}],boulders:[{x:180,r:3},{x:230,r:2},{x:410,r:3},{x:460,r:2.5},{x:700,r:3},{x:760,r:2},{x:1050,r:3}],slopes:[{x0:1150,x1:1500,grade:.25}]},target:{x0:560,x1:660},targetCenter:610}},history:"The parachute opened about 240 s after entry, at about 11 km altitude and 1,512 km/h. Powered descent began at 2.1 km, and the sky crane lowered the rover 6.4 m on cables. Perseverance touched down in Jezero Crater at about 20:55 UTC.",facts:["Terrain-Relative Navigation let Perseverance compare camera images with a map and divert to a safer spot. It was a first for Mars.","The 21.5 m parachute had to open at almost twice the speed of sound."],sources:[{title:"NASA JPL Mars 2020 landing press kit",url:"https://www.jpl.nasa.gov/news/press_kits/mars_2020/landing/mission"},{title:"Mars 2020 quick facts",url:"https://www.jpl.nasa.gov/news/press_kits/mars_2020/landing/quick_facts"},{title:"NASA Glenn: Mars atmosphere model",url:"https://www.grc.nasa.gov/www/k-12/airplane/atmosmrm.html"}],approximate:["Entry mass, aerodynamic coefficients, parachute limits and descent-stage mass are approximate public figures. Mars's rotation and cross-range steering are not modelled."]},{id:"chandrayaan3",kind:"orbital",agency:"ISRO",year:2023,date:"2023-07-15T00:00:00Z",title:"Chandrayaan-3: Earth to the Moon",craft:"Chandrayaan-3 (Propulsion Module + Vikram lander)",crew:"Uncrewed",difficulty:2,story:["14 July 2023: LVM3 launches Chandrayaan-3 from Sriharikota into an Earth orbit of about 170 \xD7 36,500 km.","There isn't enough rocket to fly straight to the Moon, so the Propulsion Module's 440 N engine raises the orbit step by step, firing each time it swings past perigee.","Then comes trans-lunar injection, timed so the Moon is waiting when the craft arrives, and a braking burn to be c ise",text:"At the next perigee add another prograde burn of about 190 m/s. The apogee passes 100,000 km and the first stage is complete."},{title:"3. Trans-lunar injection",text:"At a later perigee (around 30 July 2023 in the game) burn prograde about 175\u2013180 m/s. Check the dotted line: it must reach the Moon, with a closest approach of a few hundred km. The real burn was on 1 August."},{title:"4. Coast to the Moon",text:"Let time run. The game pauses about 3 hours before closest approach to the Moon."},{title:"5. Lunar orbit insertion",text:"Plan a Retrograde burn at the next periapsis, relative to the Moon. Increase the size until the far point is below 20,000 km (about 5,000 km is safest, because Earth's pull stretches high orbits). Capture by 6 August earns an extra star."},{title:"6. Bonus: circularise",text:"Brake again at the low points until the far point is under 200 km, keeping the near point above 90 km. ISRO did this in several small steps."}],tips:["Burn near perigee: the same fuel buys much more height there (the Oberth effect).","If a step goes wrong, Mission Assist recalculates from where you are."]},apollo13:{kind:"orbital",summary:"An oxygen tank has exploded. Put the crew on a path that enters Earth's air at a safe angle, between \u22125.3\xB0 and \u22127.4\xB0.",steps:[{title:"1. Check the entry angle",text:"Look at the predicted entry angle at the top. At the start the path is not safe."},{title:"2. Small correction burn",text:"Plan a burn of only a few m/s (about 3\u20137 m/s), prograde or retrograde, within the first hours. Watch the entry angle as you change the size, and stop when it is near \u22126.5\xB0."},{title:"3. Swing around the Moon",text:"Let time run. The Moon's gravity turns the spacecraft back towards Earth (a free return)."},{title:"4. Bonus: the PC+2 burn",text:"About 2 hours after passing closest to the Moon, a 262 m/s burn brings the crew home sooner, like the real crew did. Adjust its direction so the entry angle stays
