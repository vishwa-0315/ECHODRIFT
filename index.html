/*
 * LAUNCH WINDOW — mission-control look: near-black space, telemetry in mono,
 * condensed display type, ISRO-saffron accent, cyan trajectories.
 * Deliberately single (dark) theme, like a real flight-control room.
 */
:root {
  --bg: #04060b;
  --bg2: #0a1020;
  --panel: rgba(12, 18, 32, 0.92);
  --panel2: #111a2c;
  --line: #1f2c45;
  --text: #e7eef8;
  --muted: #8d9cb5;
  --accent: #ff9933;
  --cyan: #4cc9f0;
  --plan: #dfe8ff;
  --good: #52d273;
  --warn: #ffcc4d;
  --bad: #ff5c5c;
  --display: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --ts: 1;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: calc(16px * var(--ts)); }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--body); overscroll-behavior: none; }
button, input, select { font: inherit; color: inherit; }
#app { position: relative; max-width: 1100px; height: 100%; margin: 0 auto; overflow: hidden; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding-block: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-bottom)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-y: auto; overflow-x: hidden; }
.screen.full { padding: 0; overflow: hidden; }
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }

h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: -0.01em; margin: 0 0 0.35em; line-height: 1.05; text-wrap: balance; }
h1 { font-size: 2.3rem; font-weight: 800; letter-spacing: -0.02em; text-transform: uppercase; }
h2 { font-size: 1.4rem; }
h3 { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
p { margin: 0 0 0.7em; line-height: 1.5; max-width: 68ch; }
a { color: var(--cyan); }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.mono { font-family: var(--mono); }
.label { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.72rem; color: var(--muted); font-weight: 600; }
.accent { color: var(--accent); }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.spacer { flex: 1; }
.topbar { display: flex; align-items: center; gap: 10px; min-height: 52px; margin-bottom: 6px; }
.topbar h2 { margin: 0; flex: 1; font-size: 1.2rem; letter-spacing: -0.01em; }

.btn { min-height: 48px; min-width: 48px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); cursor: pointer; font-family: var(--display); font-weight: 600; font-size: 0.92rem; letter-spacing: 0.02em; text-transform: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; touch-action: manipulation; }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a0d00; }
.btn.go { background: var(--good); border-color: var(--good); color: #04150a; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.ghost { background: transparent; }
.btn.icon { padding: 0; width: 48px; }
.btn.sm { min-height: 40px; min-width: 40px; padding: 6px 10px; font-size: 0.9rem; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.btn.on { border-color: var(--cyan); color: var(--cyan); }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); font-size: 0.75rem; font-family: var(--display); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }
.chip.isro { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
.chip.nasa { color: var(--cyan); border-color: color-mix(in srgb, var(--cyan) 50%, transparent); }
.stars { color: var(--warn); letter-spacing: 2px; }

/* Home */
.hero { position: relative; min-height: 220px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); margin-bottom: 14px; }

.section { margin: 16px 0 8px; display: flex; align-items: baseline; gap: 10px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.mcard { position: relative; text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: linear-gradient(160deg, var(--panel2), var(--bg2)); cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-height: 150px; overflow: hidden; }
.mcard .yr { font-family: var(--display); font-size: 2.2rem; font-weight: 800; letter-spacing: -0.04em; line-height: 0.9; color: color-mix(in srgb, var(--text) 18%, transparent); position: absolute; right: 12px; top: 10px; }
.mcard .t { font-family: var(--display); font-size: 1.1rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.05; padding-right: 64px; }
.mcard .d { color: var(--muted); font-size: 0.85rem; }
.mcard .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
.diff { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }

/* Mission screens */
.view { position: absolute; inset: 0; }
.view canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.hud-tl { position: absolute; left: max(10px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 6px; z-index: 3; max-width: min(300px, 62vw); pointer-events: none; }
.hud-tl > * { pointer-events: auto; }
.hud-tr { position: absolute; right: max(10px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 6px; align-items: flex-end; z-index: 3; }
.tele { font-family: var(--mono); font-size: 0.78rem; line-height: 1.45; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-variant-numeric: tabular-nums; }
.tele .k { color: var(--muted); }
.tele .v { color: var(--text); float: right; padding-left: 10px; }
.tele .hdr { font-family: var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 600; font-size: 0.8rem; }
.tele .row2 { display: flex; justify-content: space-between; gap: 12px; }
.obj { font-size: 0.82rem; max-width: 260px; }
.obj li { margin: 2px 0; list-style: none; }
.obj ul { padding: 0; margin: 4px 0 0; }
.obj .done { color: var(--good); }
.obj .cur { color: var(--text); }
.obj .todo { color: var(--muted); }
.dock { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; padding: 8px max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); background: linear-gradient(0deg, rgba(4, 6, 11, 0.96), rgba(4, 6, 11, 0.75) 70%, rgba(4, 6, 11, 0)); display: flex; flex-direction: column; gap: 8px; }
.clock { font-family: var(--mono); font-size: 0.85rem; color: var(--cyan); }
.warp { font-family: var(--mono); min-width: 74px; text-align: center; }
.burned { align-self: center; padding: 6px 14px; font-size: 13px; white-space: nowrap; border-radius: 10px; background: var(--panel); border: 1px solid var(--accent); color: var(--accent); font-family: var(--display); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
.editor { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.editor .line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.editor input[type='range'] { flex: 1; min-width: 140px; accent-color: var(--accent); height: 32px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
.seg button { min-height: 40px; min-width: 44px; padding: 6px 10px; border: none; background: transparent; cursor: pointer; font-family: var(--display); font-weight: 600; font-size: 0.82rem; }
.seg button[aria-pressed='true'] { background: var(--cyan); color: #021018; }
.gauge { height: 10px; border-radius: 5px; background: #16203a; position: relative; overflow: hidden; }
.gauge > i { position: absolute; top: 0; bottom: 0; background: var(--good); }
.gauge > b { position: absolute; top: -3px; bottom: -3px; width: 3px; background: #fff; }

/* Lander */
.throttle { position: absolute; right: max(12px, env(safe-area-inset-right)); bottom: 120px; top: 170px; width: 64px; z-index: 4; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.throttle input { writing-mode: vertical-lr; direction: rtl; flex: 1; width: 48px; accent-color: var(--accent); }
.callout { position: absolute; left: 50%; top: 35%; transform: translateX(-50%); z-index: 5; font-family: var(--display); font-size: 2.2rem; font-weight: 700; color: var(--warn); text-shadow: 0 2px 8px #000; letter-spacing: 0.06em; pointer-events: none; }

/* Overlays */
.overlay { position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(2, 4, 8, 0.72); }
.modal { width: min(560px, 100%); max-height: 92%; overflow: auto; background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.toast { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); z-index: 40; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; max-width: 90%; font-size: 0.9rem; box-shadow: 0 8px 30px #000a; }
.busy { position: absolute; inset: 0; z-index: 35; display: flex; align-items: center; justify-content: center; background: rgba(2, 4, 8, 0.5); font-family: var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
.story p { font-size: 1.02rem; }
.spec { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.spec td { padding: 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.spec td:first-child { color: var(--muted); width: 46%; padding-right: 8px; }
.spec td:last-child { font-family: var(--mono); }
.src a { word-break: break-word; }
.chart { width: 100%; height: 220px; border: 1px solid var(--line); border-radius: 10px; background: #070b14; touch-action: none; display: block; }
.big { font-family: var(--display); font-size: 2.2rem; font-weight: 700; }
.ok { color: var(--good); }
.no { color: var(--bad); }
.warnc { color: var(--warn); }
@media (max-width: 520px) {
  h1 { font-size: 2.1rem; }
  .tele { font-size: 0.7rem; }
  .hud-tl { max-width: 58vw; }
}

/* Orbital HUD (phone-first) */
.hud-top { position: absolute; left: 0; right: 0; top: 0; z-index: 3; padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 6px; background: linear-gradient(180deg, rgba(4, 6, 11, 0.92), rgba(4, 6, 11, 0.6) 80%, rgba(4, 6, 11, 0)); padding-bottom: 10px; }
.hud-top .label { font-size: 0.72rem; line-height: 1.1; }
.telegrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px 10px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.telegrid .cell { display: flex; flex-direction: column; min-width: 0; }
.telegrid .k { color: var(--muted); font-size: 0.62rem; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.telegrid .v { color: var(--text); font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.objline { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 10px; padding: 6px 8px; font-size: 0.9rem; }
.objline .steps { font-family: var(--mono); letter-spacing: 2px; }
.objline .steps .done { color: var(--good); }
.objline .steps .cur { color: var(--accent); }
.objline .steps .todo { color: var(--muted); }
.objline .hint { color: var(--muted); font-size: 0.82rem; margin-top: 2px; line-height: 1.35; }
.hud-side { position: absolute; right: max(10px, env(safe-area-inset-right)); top: 46%; transform: translateY(-50%); z-index: 3; display: flex; flex-direction: column; gap: 6px; }
@media (min-width: 760px) { .telegrid { grid-template-columns: repeat(6, minmax(0, 1fr)); } .hud-top { padding-right: 80px; } }

.telegrid .v, .warp { font-variant-numeric: tabular-nums; }
.hero .inner { max-width: 64%; }
@media (max-width: 520px) { .hero .inner { max-width: 70%; } .hero .inner p { font-size: 0.92rem; } }

.screen:not(.full) > * { flex-shrink: 0; }

/* ================= Quick play (joyful layer) ================= */
@keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 153, 51, 0.55); } 50% { box-shadow: 0 0 0 10px rgba(255, 153, 51, 0); } }
@keyframes blink { 50% { opacity: 0.35; } }

/* Home */
.home .hero { min-height: 190px; }
.home .hero h1 { font-size: 2.4rem; }
.tagline { font-size: 0.98rem; color: #d7e0ee; }
.home-toggles { position: absolute; right: 8px; bottom: 8px; z-index: 2; display: flex; gap: 4px; }
.home-toggles .off { opacity: 0.55; }
.play-row { display: flex; gap: 10px; align-items: stretch; margin: 4px 0 6px; }
.play-btn { flex: 1; min-height: 68px; flex-direction: column; gap: 2px; font-size: 1.35rem; font-weight: 800; border-radius: 16px; animation: glow 2.2s infinite; }
.play-btn .small { font-size: 0.85rem; font-weight: 600; opacity: 0.85; }
.star-total { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 86px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel2); }
.star-total .big { font-size: 1.5rem; color: var(--warn); }
.level-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.level-tile { position: relative; text-align: left; border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: linear-gradient(160deg, #15203a, #0a1020); cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-height: 132px; transition: transform 0.12s; }
.level-tile:active { transform: scale(0.97); }
.level-tile.next { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.level-tile.locked { opacity: 0.5; cursor: not-allowed; }
.lt-num { position: absolute; right: 10px; top: 8px; font-weight: 800; color: color-mix(in srgb, var(--text) 35%, transparent); font-size: 1.1rem; }
.lt-icon { font-size: 1.9rem; line-height: 1.1; }
.lt-title { font-weight: 700; font-size: 1rem; line-height: 1.15; }
.lt-mission { color: var(--muted); font-size: 0.78rem; }
.lt-stars { margin-top: auto; color: var(--warn); letter-spacing: 2px; font-size: 1rem; }
.level-tile.locked .lt-stars { color: var(--muted); letter-spacing: 0; font-size: 0.75rem; }
.home-more { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-top: 16px; }

/* Guide (Vyom) */
.guide { display: none; align-items: flex-end; gap: 6px; cursor: pointer; }
.guide.show { display: flex; }
.guide.pop .bubble { animation: pop 0.35s ease-out; }

.bubble { position: relative; background: #f4f7fc; color: #0b1a33; border-radius: 16px 16px 16px 4px; padding: 10px 30px 10px 12px; font-size: 0.98rem; line-height: 1.35; font-weight: 500; max-width: 420px; box-shadow: 0 6px 24px #0008; }
.bubble-next { position: absolute; right: 10px; bottom: 8px; color: #ff9933; font-weight: 800; }
.bubble-go { margin-top: 6px; font-size: 0.8rem; font-weight: 700; color: #d06f00; }
.guide.compact .bubble { font-size: 0.92rem; }
.home > .guide { margin: 0 0 8px; }

/* Play screen */
.play { background: #04060b; touch-action: none; user-select: none; -webkit-user-select: none; }
.play-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.play-top { position: absolute; left: 0; right: 0; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px; padding: max(8px, env(safe-area-inset-top)) 12px 0; }
.play-title { flex: 1; min-width: 0; }
.play-title .lvl { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.play-title .t { font-size: 1.15rem; font-weight: 800; }
.play-goal-stars { color: var(--warn); letter-spacing: 3px; font-size: 1.1rem; opacity: 0.6; }
.play-hud { position: absolute; left: 12px; right: 12px; top: calc(max(8px, env(safe-area-inset-top)) + 50px); z-index: 3; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.play-info { display: flex; gap: 8px; }
.chip-stat { flex: 1; min-width: 0; background: rgba(12, 18, 32, 0.85); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; display: flex; flex-direction: column; }
.chip-stat .k { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.chip-stat .v { font-size: 1.15rem; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fuel { display: flex; align-items: center; gap: 8px; }
.fuel-label { font-size: 0.78rem; font-weight: 700; color: var(--muted); }

.fuel-fill { height: 100%; background: linear-gradient(90deg, #ff9933, #ffcc4d); border-radius: 6px; transition: width 0.1s linear; }

.play-alert { position: absolute; left: 50%; top: 42%; transform: translateX(-50%); z-index: 4; font-weight: 800; font-size: 1.5rem; color: var(--bad); text-shadow: 0 2px 10px #000; pointer-events: none; animation: blink 0.6s infinite; white-space: nowrap; }
.demo-banner { align-self: center; font-size: 0.85rem; background: rgba(76, 201, 240, 0.15); border: 1px solid var(--cyan); color: var(--cyan); border-radius: 999px; padding: 6px 14px; font-weight: 700; white-space: nowrap; }
.play-bottom { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; padding: 10px 14px max(14px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; background: linear-gradient(0deg, rgba(4, 6, 11, 0.95), rgba(4, 6, 11, 0.6) 70%, rgba(4, 6, 11, 0)); }
.big-btn { align-self: center; width: min(320px, 86vw); min-height: 76px; border-radius: 40px; border: none; cursor: pointer; background: radial-gradient(circle at 50% 30%, #ffb05c, #ff8a1f 60%, #d76a00); color: #1a0d00; box-shadow: 0 6px 0 #9a4c00, 0 10px 24px #000a; transition: transform 0.06s, box-shadow 0.06s; touch-action: none; }

.big-btn.pressed { transform: translateY(5px); box-shadow: 0 1px 0 #9a4c00, 0 4px 12px #000a; background: radial-gradient(circle at 50% 30%, #fff1c2, #ffb347 60%, #ff7b00); }
.big-btn[disabled] { filter: grayscale(0.7); opacity: 0.6; }
.aim-row { display: flex; align-items: center; gap: 8px; }
.aim-row input { flex: 1; accent-color: var(--accent); height: 36px; }

/* Results & quiz */
.result-card { animation: pop 0.35s ease-out; }
.result-head { display: flex; gap: 12px; align-items: center; }
.result-head h2 { margin-bottom: 4px; }
.result-head p { margin: 0; }
.star-row { display: flex; gap: 6px; font-size: 2.4rem; line-height: 1; color: #2a3550; }
.star.on.pop { color: var(--warn); animation: pop 0.45s ease-out; text-shadow: 0 0 14px rgba(255, 204, 77, 0.7); }
.result-lines { margin: 12px 0 8px; padding-left: 18px; }
.result-lines li { margin: 2px 0; }
.fact { background: var(--panel2); border-left: 3px solid var(--accent); border-radius: 8px; padding: 8px 10px; font-size: 0.92rem; }
.unlocks { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.unlock { display: flex; gap: 10px; align-items: center; background: rgba(255, 204, 77, 0.08); border: 1px solid rgba(255, 204, 77, 0.4); border-radius: 10px; padding: 8px 10px; animation: pop 0.5s ease-out 1.4s both; }

.confetti { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 31; pointer-events: none; }

/* Badges & rockets */
.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.badge { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--panel2); opacity: 0.55; }
.badge.got { opacity: 1; border-color: rgba(255, 204, 77, 0.55); background: linear-gradient(160deg, #2a2410, #111a2c); }

.skin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.skin { border: 1px solid var(--line); border-radius: 12px; padding: 8px; background: var(--panel2); cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 2px; }

.skin.locked { opacity: 0.5; cursor: not-allowed; }
.skin-prev { width: 100%; height: 80px; display: block; }

.cam-btn { min-height: 36px; font-size: 0.8rem; padding: 4px 10px; background: rgba(12, 18, 32, 0.85); }

/* Vyom everywhere */

.toast { display: flex; align-items: center; gap: 8px; }
.toast-vyom { flex: none; display: flex; }
.modal-vyom { float: right; margin: -4px -4px 4px 8px; }
.toast { width: max-content; max-width: min(92vw, 460px); }

.play-title .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 380px) { .play-title .t { font-size: 1rem; } .big-btn { min-height: 66px; } .big-btn .big-label { font-size: 1.4rem; } }

/* Mission timeline */
.timeline { position: relative; display: flex; flex-direction: column; gap: 10px; padding-left: 0; }
.timeline::before { content: ''; position: absolute; left: 77px; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: linear-gradient(180deg, #4cc9f0, #ff9933 60%, #52d273); opacity: 0.55; }
.tl-era { margin: 8px 0 0 96px; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--cyan); }
.tl-node { position: relative; display: grid; grid-template-columns: 62px 32px 1fr; align-items: center; gap: 0 10px; background: none; border: none; padding: 0; text-align: left; cursor: pointer; color: inherit; }
.tl-node[disabled] { cursor: not-allowed; }
.tl-when { text-align: right; }
.tl-year { font-weight: 800; font-size: 1.05rem; line-height: 1; }
.tl-day { font-size: 0.72rem; color: var(--muted); }
.tl-dot { z-index: 1; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 800; background: #16203a; border: 2px solid var(--line); }
.tl-node.done .tl-dot { background: var(--good); border-color: var(--good); color: #04150a; }
.tl-node.next .tl-dot { background: var(--accent); border-color: var(--accent); color: #1a0d00; animation: glow 2s infinite; }
.tl-card { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; background: linear-gradient(160deg, #15203a, #0a1020); min-width: 0; transition: transform 0.12s; }
.tl-node:active .tl-card { transform: scale(0.98); }
.tl-node.next .tl-card { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.tl-node.locked { opacity: 0.5; }
.tl-icon { width: 38px; height: 38px; flex: none; display: block; }
.tl-text { min-width: 0; }
.tl-title { font-weight: 700; font-size: 1rem; line-height: 1.15; }
.tl-mission { color: var(--muted); font-size: 0.78rem; }
.tl-stars { color: var(--warn); letter-spacing: 2px; font-size: 0.95rem; }
.tl-node.locked .tl-stars { color: var(--muted); letter-spacing: 0; font-size: 0.75rem; }
.quiz-play { width: 100%; justify-content: flex-start; gap: 10px; margin: 2px 0 4px; min-height: 56px; border-color: rgba(76, 201, 240, 0.5); background: linear-gradient(90deg, rgba(76, 201, 240, 0.14), var(--panel2)); text-align: left; }
.qp-ic { font-size: 1.5rem; }
.tl-node.future { opacity: 0.6; cursor: default; }
.tl-node.future .tl-card { border-style: dashed; background: transparent; }
.tl-node.future .tl-stars { color: var(--cyan); letter-spacing: 0; font-size: 0.75rem; }

/* Quiz to Orbit */
.qg-q { position: absolute; left: 12px; right: 64px; top: calc(max(8px, env(safe-area-inset-top)) + 54px); z-index: 3; background: rgba(12, 18, 32, 0.9); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.qg-num { font-size: 0.72rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
.qg-text { font-size: 1.08rem; font-weight: 700; line-height: 1.3; }
.qg-gates { --p: 0; position: absolute; left: 8px; right: 60px; top: calc(28% + var(--p) * 34%); z-index: 3; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; transition: top 0.05s linear; }
.qg-gate { min-height: 64px; border-radius: 16px; border: 2px dashed rgba(76, 201, 240, 0.8); background: rgba(10, 20, 40, 0.85); color: var(--text); font-weight: 700; font-size: 0.9rem; padding: 6px; cursor: pointer; line-height: 1.2; }
.qg-gate.picked { border-style: solid; border-color: var(--accent); background: rgba(255, 153, 51, 0.25); }
.qg-gate.right { border-style: solid; border-color: var(--good); background: rgba(82, 210, 115, 0.35); }
.qg-gate.wrong { border-style: solid; border-color: var(--bad); background: rgba(255, 92, 92, 0.3); }
.qg-meter { position: absolute; right: 12px; top: calc(max(8px, env(safe-area-inset-top)) + 58px); bottom: 110px; z-index: 3; width: 40px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.qg-bar { position: relative; flex: 1; width: 16px; border-radius: 8px; background: #16203a; border: 1px solid var(--line); overflow: visible; }
.qg-fill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 8px; background: linear-gradient(0deg, #ff9933, #ffcc4d); transition: height 0.4s; }
.qg-mark { position: absolute; right: 18px; transform: translateY(50%); font-size: 0.7rem; font-weight: 700; white-space: nowrap; color: var(--good); }
.qg-val { font-size: 0.7rem; font-weight: 700; text-align: center; white-space: nowrap; }
.qg-hearts { font-size: 0.9rem; letter-spacing: 1px; }
.qg-msg { position: absolute; left: 12px; right: 12px; bottom: max(14px, env(safe-area-inset-bottom)); z-index: 4; }
.qg-say { display: flex; gap: 8px; align-items: center; background: #f4f7fc; color: #0b1a33; border-radius: 14px; padding: 8px 12px; font-size: 0.9rem; animation: pop 0.3s; }

/* Solar System explorer */
.sx-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.sx-chip { cursor: pointer; background: var(--panel2); min-height: 34px; text-transform: none; letter-spacing: 0; font-size: 0.82rem; }
.sx-chip.on { border-color: var(--accent); color: var(--accent); }
.sx-tabs { margin: 4px 0 10px; }
.sx-moon { border-top: 1px solid var(--line); padding: 8px 0; }
.sx-moon .b { font-weight: 700; }
.sx-select { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-height: 36px; }
.sx-hz { margin-top: 10px; border-color: rgba(82, 210, 115, 0.5); }

/* emoji-free shapes */
.tl-dot svg { color: #c9d4e6; }
.toggle-btn { min-width: 0; padding: 4px 10px; font-size: 0.78rem; min-height: 34px; background: rgba(12, 18, 32, 0.7); }
.toggle-btn.off { opacity: 0.6; }
.qp-ic { width: 30px; height: 30px; border-radius: 50%; flex: none; background: radial-gradient(circle at 35% 35%, #8fdcff, #2a73c9 55%, #0a1f40); box-shadow: 0 0 0 2px rgba(255, 153, 51, 0.8); }
.medal { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.05rem; color: #3a2a00; background: radial-gradient(circle at 35% 30%, #fff1b8, #f2c94c 55%, #b8860b); box-shadow: 0 2px 0 #8a6400; flex: none; }
.medal.off { background: #2a3550; color: #56617a; box-shadow: none; }
.medal.skin { background: radial-gradient(circle at 35% 30%, #e0f7ff, #4cc9f0 60%, #1b6f8f); color: #032130; box-shadow: 0 2px 0 #134f66; }
.unlock .medal { width: 30px; height: 30px; }
.life { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-left: 4px; border: 2px solid #ff5c8a; }
.life.on { background: #ff5c8a; }
.cam-btn::before { content: 'View '; color: var(--muted); font-weight: 500; }
@media (max-width: 380px) { .cam-btn::before { content: ''; } }

/* Expert mission guide */
.guide-modal { max-height: 90%; }
.guide-steps { display: flex; flex-direction: column; gap: 8px; margin: 6px 0 10px; }
.guide-step { border-left: 3px solid var(--accent); background: var(--panel2); border-radius: 8px; padding: 8px 10px; line-height: 1.45; }
.guide-step .b { font-weight: 700; margin-bottom: 2px; }
.guide-controls { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.guide-controls .guide-step { border-left-color: var(--cyan); }
.guide-overlay { z-index: 45; }
.play-title .t.long { font-size: 0.98rem; }
@media (max-width: 380px) { .play-title .t.long { font-size: 0.86rem; } }
</style>
</head>

<script>(()=>{var tn=[{id:"apollo11",kind:"lander",agency:"NASA",year:1969,date:"1969-07-20T20:17:40Z",title:"Apollo 11: The Eagle Has Landed",craft:"Lunar Module Eagle (LM-5)",crew:"Neil Armstrong, Buzz Aldrin (Michael Collins in orbit aboard Columbia)",difficulty:1,story:["20 July 1969. Eagle is descending toward the Sea of Tranquility when the guidance computer flashes program alarms 1202 and 1201. Mission Control decides it's safe to continue.","Close to the surface, Neil Armstrong sees that the computer is steering them into a boulder field around a crater. He takes semi-manual control and flies on, looking for a clear spot.",`In Houston, Charlie Duke calls out fuel: "60 seconds"\u2026 "30 seconds". That's the time left before they must land or abort.`],goal:"Fly past the boulder field and touch down gently before you run out of fuel.",physics:{g:1.62,engine:{name:"Descent Propulsion System",thrust:45040,isp:305,minThrottle:.1,maxThrottle:.6},mass:7600,dryMass:6930,start:{x:-120,z:152,vx:13,vz:-4,pitch:-10},pitchRate:10,maxPitch:45,limits:{vz:3,vx:1.2,tilt:12},footprint:4.5,bingoReserveSeconds:20,callouts:[60,30],target:{x0:300,x1:520},terrain:{base:0,craters:[{x:120,r:90,depth:18,rim:3},{x:420,r:8,depth:1.2,rim:.3},{x:610,r:30,depth:5,rim:1}],boulders:[{x:20,r:2.5},{x:45,r:3},{x:70,r:2},{x:95,r:4},{x:150,r:3.5},{x:175,r:2.5},{x:200,r:3},{x:228,r:2},{x:255,r:2.5},{x:560,r:2.5},{x:585,r:3}]},surface:"moon"},history:'Eagle touched down at 20:17:40 UTC on 20 July 1969, a few hundred metres beyond West crater. Post-flight analysis estimated roughly 45 seconds of fuel remained before the abort deadline, more than the "30 seconds" called at the time, because propellant sloshing had fooled the low-level sensor.',facts:["The descent engine was the first throttleable rocket engine flown in space.","Lunar gravity is about one-sixth of Earth's, so hovering burns far less fuel than it would on Earth."],sources:[{title:"Descent propulsion system (thrust, throttle range, Isp)",url:"https://en.wikipedia.org/wiki/Descent_propulsion_system"},{title:"NASA: 50 Years Ago, One Small Step",url:"https://www.nasa.gov/feature/50-years-ago-one-small-step-one-giant-leap"}],approximate:["Lander mass and fuel at the start of this final approach are estimates for gameplay; the engine figures are the real DPS values."]},{id:"apollo13",kind:"orbital",agency:"NASA",year:1970,date:"1970-04-14T03:08:00Z",title:"Apollo 13: Get Them Home",craft:"Odyssey (CSM) + Aquarius (LM)",crew:"Jim Lovell, Jack Swigert, Fred Haise",difficulty:3,story:["14 April 1970, 55 h 54 min into the flight. An oxygen tank in the Service Module explodes. The Moon landing is off; now the only goal is getting three astronauts home alive.",`The ship is on a "hybrid" trajectory that skims about 110 km above the Moon and would then miss Earth completely. The crew must burn the Lunar Module's descent engine to get back onto a free-return path, one where the Moon's gravity swings them home.`,"They must hit Earth's atmosphere at just the right angle. Too steep and they burn up; too shallow and they skip off into space."],goal:"Burn the LM descent engine to reach Earth's entry corridor: \u22127.4\xB0 to \u22125.3\xB0 at 121.9 km altitude.",physics:{central:"earth",perturbers:["moon","sun"],span:6,ship:{name:"Apollo 13 stack (LM descent engine)",wetMass:44e3,dryMass:35800,engine:{name:"LM Descent Propulsion System",thrust:18016,isp:305}},entryInterface:{body:"earth",altitude:121920,stop:!0},corridor:[-7.4,-5.3]},history:'At 61 h 29 min the crew burned the LM descent engine for about 35 s (\u2248 11.6 m/s) to restore a free return. After swinging around the Moon they made the "PC+2" burn (\u2248 262 m/s) to speed the trip home. Odyssey splashed down in the Pacific on 17 April 1970.',facts:["The burn was done with the Lunar Module steering the whole docked stack, something it was never designed for.","Apollo 13 holds the record for the farthest humans have travelled from Earth."],sources:[{title:"NASA Apollo Flight Journal: Apollo 13",url:"https://www.nasa.gov/history/afj/ap13fj/11day3-minimise-power.html"},{title:"Apollo 13 entry and trajectory notes (NASA NTRS)",url:"https://ntrs.nasa.gov/api/citations/20090026451/downloads/20090026451.pdf"}],approximate:["Stack mass, remaining DPS propellant and the throttle (40%) are approximations. Because this game is 2D, the corrective burn needed differs from the real 11.6 m/s."],stageText:{freeReturn:{title:"Back to free return",hint:"Make a small burn so the predicted path enters Earth\u2019s atmosphere between \u22127.4\xB0 and \u22125.3\xB0. Watch the entry gauge."},pc2:{title:"PC+2 burn (bonus)",hint:"After passing the Moon, make a 262 m/s burn that brings the crew home sooner, still inside the corridor."}}},{id:"voyager2",kind:"orbital",agency:"NASA / JPL",year:1979,date:"1979-03-01T00:00:00Z",title:"Voyager 2: The Grand Tour",craft:"Voyager 2",crew:"Uncrewed",difficulty:3,story:["In the late 1970s the outer planets lined up in a way that happens only once every 175 years. Voyager 2 can use Jupiter's gravity as a slingshot to reach Saturn, and later Uranus and Neptune.","It's March 1979. Voyager 2 is closing in on Jupiter, but its aim is slightly off. A small trajectory correction now decides whether Jupiter flings it to Saturn or off into empty space."],goal:"Make a correction burn so that Jupiter's gravity assist sends Voyager 2 within 1,000,000 km of Saturn.",physics:{central:"sun",perturbers:["jupiter","saturn"],span:1e3,ship:{name:"Voyager 2",wetMass:722,dryMass:690,engine:{name:"Hydrazine thrusters",thrust:89,isp:220}},saturnTargetKm:1e6},history:"Voyager 2 passed Jupiter on 9 July 1979 (about 570,000 km above the clouds) and Saturn on 26 August 1981. It went on to become the only spacecraft to visit Uranus (1986) and Neptune (1989).",facts:["A gravity assist steals a tiny bit of a planet's orbital energy. Jupiter slowed down by an immeasurably small amount.","Voyager 2 is now in interstellar space, more than 20 billion km from Earth."],sources:[{title:"Voyager 2 flyby dates and distances",url:"https://www.universetoday.com/articles/voyager-2"},{title:"NASA: Voyager mission",url:"https://science.nasa.gov/mission/voyager/"}],approximate:["Spacecraft mass and thruster figures are approximate. The flyby distances and dates come from a trajectory designed to match the real ones in this 2D model."],stageText:{aim:{title:"Correct course",hint:"A tiny burn now shifts where you pass Jupiter, and that changes everything after. Get the predicted Saturn approach under 1,000,000 km."},saturn:{title:"Reach Saturn",hint:"Fly through the Jupiter gravity assist all the way to Saturn."}}},{id:"mangalyaan",kind:"orbital",agency:"ISRO",year:2014,date:"2013-11-05T09:08:00Z",title:"Mangalyaan: Mars on the First Try",craft:"Mars Orbiter Mission (MOM)",crew:"Uncrewed",difficulty:2,story:["India's first interplanetary mission had a tight budget and a small rocket. The PSLV couldn't throw the spacecraft straight to Mars, so ISRO raised its orbit around Earth six times before the final push.","Launch windows to Mars open only once every 26 months. Pick the departure date and travel time that the spacecraft's fuel can afford.","Then, ten months later, the 440 N main engine must fire for about 23 minutes at Mars, and it hasn't run for 300 days. Too little and Mangalyaan sails past Mars forever."],goal:"Choose a launch window, aim for Mars, and fire the engine to enter Mars orbit (periapsis 300\u2013800 km).",physics:{central:"sun",perturbers:["earth","mars","jupiter","venus"],span:360,ship:{name:"Mars Orbiter Mission",wetMass:845,dryMass:482.5,engine:{name:"440 N Liquid Apogee Motor",thrust:440,isp:315}},massBeforeTMI:1012,preTMIorbitKm:[248,192874],window:{departFrom:"2013-10-20",departTo:"2014-01-20",tofMin:200,tofMax:360},captureKm:{periMin:300,periMax:800,apoMax:1e5}},history:"Launched on 5 November 2013 on PSLV-C25, Mangalyaan left Earth on 1 December 2013 and fired its engine for 1,388.67 s on 24 September 2014. It entered a 421.7 \xD7 76,993.6 km Mars orbit, making India the first nation to reach Mars orbit on its first attempt.",facts:["The Mars Orbiter Mission was famously cheaper than the film Gravity.","MOM's orbit took 72 hours 51 minutes, which is why its photos could capture the whole disc of Mars."],sources:[{title:"Mars Orbiter Mission (masses, burns, orbit)",url:"https://en.wikipedia.org/wiki/Mars_Orbiter_Mission"}],approximate:["Mass after the Earth-orbit raising burns (1,012 kg) is an estimate. The LAM specific impulse (315 s) is approximate."],stageText:{tcm:{title:"Trajectory correction",hint:"Months before arrival, a small burn moves your closest approach to Mars to 300\u2013800 km altitude."},moi:{title:"Mars orbit insertion",hint:"At closest approach, burn retrograde relative to Mars for about 20+ minutes. Too short and you fly past Mars forever."}}},{id:"perseverance",kind:"edl",agency:"NASA / JPL",year:2021,date:"2021-02-18T20:55:00Z",title:"Perseverance: Seven Minutes of Terror",craft:"Mars 2020 (Perseverance rover)",crew:"Uncrewed",difficulty:2,story:["18 February 2021. Perseverance hits the top of Mars's atmosphere at about 19,500 km/h. Radio signals take over 11 minutes to reach Earth, so everything happens on its own.","The capsule rolls its lift up or down to steer. When it has slowed enough, the supersonic parachute opens, and that only works within a narrow window.","Finally the descent stage fires its rockets and lowers the rover on cables: the sky crane."],goal:"Steer the entry, open the parachute in its safe window, then fly the descent stage to a safe spot in Jezero Crater.",physics:{entry:{alt:125e3,v:5420,gammaDeg:-15.5,mass:3440},aero:{cd:1.65,area:15.9,ld:.24,noseRadius:1.125},chute:{cd:.62,area:363,maxMach:2.2,minMach:1.1,maxQ:850,shieldSepDelay:20,shieldMass:440},backshellAlt:2100,targetDownrange:65e4,ellipseKm:7.7,lander:{g:3.721,engine:{name:"8 \xD7 Mars Landing Engine",thrust:24800,isp:220,minThrottle:.13,maxThrottle:1},mass:2100,dryMass:1700,pitchRate:25,maxPitch:45,limits:{vz:1,vx:.5,tilt:15},footprint:2,skycraneAlt:20,skycraneSpeed:.75,terrain:{base:0,craters:[{x:300,r:60,depth:10,rim:2},{x:900,r:40,depth:7,rim:1.5}],boulders:[{x:180,r:3},{x:230,r:2},{x:410,r:3},{x:460,r:2.5},{x:700,r:3},{x:760,r:2},{x:1050,r:3}],slopes:[{x0:1150,x1:1500,grade:.25}]},target:{x0:560,x1:660},targetCenter:610}},history:"The parachute opened about 240 s after entry, at about 11 km altitude and 1,512 km/h. Powered descent began at 2.1 km, and the sky crane lowered the rover 6.4 m on cables. Perseverance touched down in Jezero Crater at about 20:55 UTC.",facts:["Terrain-Relative Navigation let Perseverance compare camera images with a map and divert to a safer spot. It was a first for Mars.","The 21.5 m parachute had to open at almost twice the speed of sound."],sources:[{title:"NASA JPL Mars 2020 landing press kit",url:"https://www.jpl.nasa.gov/news/press_kits/mars_2020/landing/mission"},{title:"Mars 2020 quick facts",url:"https://www.jpl.nasa.gov/news/press_kits/mars_2020/landing/quick_facts"},{title:"NASA Glenn: Mars atmosphere model",url:"https://www.grc.nasa.gov/www/k-12/airplane/atmosmrm.html"}],approximate:["Entry mass, aerodynamic coefficients, parachute limits and descent-stage mass are approximate public figures. Mars's rotation and cross-range steering are not modelled."]},{id:"chandrayaan3",kind:"orbital",agency:"ISRO",year:2023,date:"2023-07-15T00:00:00Z",title:"Chandrayaan-3: Earth to the Moon",craft:"Chandrayaan-3 (Propulsion Module + Vikram lander)",crew:"Uncrewed",difficulty:2,story:["14 July 2023: LVM3 launches Chandrayaan-3 from Sriharikota into an Earth orbit of about 170 \xD7 36,500 km.","There isn't enough rocket to fly straight to the Moon, so the Propulsion Module's 440 N engine raises the orbit step by step, firing each time it swings past perigee.","Then comes trans-lunar injection, timed so the Moon is waiting when the craft arrives, and a braking burn to be captured into lunar orbit."],goal:"Raise your orbit, fly to the Moon and fire a braking burn to enter lunar orbit (periapsis 100\u20131,000 km, apoapsis below 20,000 km).",physics:{central:"earth",perturbers:["moon","sun"],span:40,ship:{name:"Chandrayaan-3 integrated module",wetMass:3900,dryMass:2204,engine:{name:"440 N Liquid Apogee Motor",thrust:440,isp:315}},startOrbitKm:[170,36500],perigeeLongitudeDeg:184,captureKm:{periMin:100,periMax:1e3,apoMax:2e4},circularKm:{max:200}},history:"After five Earth-bound burns, trans-lunar injection came on 1 August 2023 (IST). Lunar orbit insertion on 5 August placed Chandrayaan-3 in a 164 \xD7 18,074 km orbit, later circularised to 153 \xD7 163 km.",facts:["Chandrayaan-3 took about 40 days to reach the Moon. Apollo took about 3, but needed a giant Saturn V rocket.","The Propulsion Module later returned to Earth orbit: a bonus test of ISRO's navigation skills."],sources:[{title:"ISRO: Chandrayaan-3 mission updates",url:"https://www.isro.gov.in/Chandrayaan3.html"},{title:"Chandrayaan-3 (masses, landing site)",url:"https://en.wikipedia.org/wiki/Chandrayaan-3"}],approximate:["The Propulsion Module engine's specific impulse is approximate. The perigee direction is chosen so the real Moon is reachable on similar dates."],stageText:{raise:{title:"Raise your orbit",hint:"Burn prograde at perigee (closest to Earth). Each burn lifts the far side of the orbit. Get the apogee above 100,000 km."},tli:{title:"Trans-lunar injection",hint:"From perigee, burn prograde again so the orbit stretches out to where the Moon WILL be when you arrive. Watch the dashed prediction meet the Moon."},loi:{title:"Lunar orbit insertion",hint:"At closest approach to the Moon, burn retrograde (against your motion relative to the Moon) to be captured. Aim for 100\u20131,000 km periapsis and apoapsis below 20,000 km."},circular:{title:"Circularise (bonus)",hint:"Lower the orbit to under 200 km with braking burns at perilune, like ISRO did."}}},{id:"vikram",kind:"lander",agency:"ISRO",year:2023,date:"2023-08-23T12:33:00Z",title:"Chandrayaan-3: Vikram at the South Pole",craft:"Vikram lander (with Pragyan rover)",crew:"Uncrewed",difficulty:1,story:["23 August 2023. Vikram is descending near the Moon's south pole, where no spacecraft had ever landed softly.","At about 150 m it pauses and hovers, and its hazard camera searches for flat, boulder-free ground.","Its four 800 N engines must set the lander down gently: its legs can take no more than about 3 m/s."],goal:"Hover, pick a safe spot from the hazard map, and land at under 3 m/s.",physics:{g:1.62,engine:{name:"4 \xD7 800 N throttleable engines",thrust:3200,isp:300,minThrottle:.4,maxThrottle:1},mass:1380,dryMass:1250,start:{x:0,z:800,vx:0,vz:-12,pitch:0},pitchRate:15,maxPitch:30,limits:{vz:3,vx:.5,tilt:12},footprint:2.5,hazardHoverAlt:150,target:{x0:-20,x1:20},terrain:{base:0,craters:[{x:-140,r:40,depth:8,rim:1.5},{x:60,r:25,depth:5,rim:1},{x:210,r:50,depth:9,rim:2}],boulders:[{x:-70,r:2},{x:-40,r:1.5},{x:-10,r:2},{x:20,r:1.5},{x:100,r:2},{x:130,r:1.5},{x:290,r:2}],slopes:[{x0:-300,x1:-200,grade:.2}]},safeSpots:[{x:-100,w:14},{x:155,w:16},{x:250,w:10}],surface:"moon"},history:"Vikram touched down at 12:33 UTC (18:03 IST) on 23 August 2023 at 69.373\xB0S, 32.319\xB0E. India became the first country to land near the lunar south pole. Pragyan rolled out the next day and confirmed sulphur in the soil.",facts:["The landing site is now called Shiv Shakti Point.",'Vikram later "hopped": it re-fired its engines, rose about 40 cm and landed again 30\u201340 cm away.'],sources:[{title:"Chandrayaan-3 (lander mass, engines, landing site, time)",url:"https://en.wikipedia.org/wiki/Chandrayaan-3"},{title:"ISRO: Chandrayaan-3",url:"https://www.isro.gov.in/Chandrayaan3.html"}],approximate:["Mass and fuel at 800 m, engine Isp and the minimum throttle are estimates; engine count and thrust are real."]},{id:"aditya",kind:"orbital",agency:"ISRO",year:2024,date:"2024-01-06T10:30:00Z",title:"Aditya- s 9.81 m/s\xB2."},{level:"vikram",q:"Where on the Moon did Vikram land?",options:["Near the south pole","Near the north pole","On the far side's equator","At the Apollo 11 site"],answer:0,explain:"Vikram landed near the lunar south pole on 23 August 2023, the first landing ever in that region."},{level:"vikram",q:"What name was given to Vikram's landing spot?",options:["Tiranga Point","Jawahar Point","Shiv Shakti Point","Vikram Point"],answer:2,explain:"It is called Shiv Shakti Point. Chandrayaan-2's impact site is Tiranga Point, and Chandrayaan-1's probe hit Jawahar Point."},{level:"vikram",q:"Why can't a Moon lander use a parachute?",options:["Parachutes are too heavy","The Moon has no air","It is too cold","The Moon spins too fast"],answer:1,explain:"A parachute needs air to push against. The Moon has almost no atmosphere, so only rocket engines can slow you down."},{level:"window",q:"How often do Earth and Mars line up for a fuel-saving trip?",options:["Every 6 months","Every year","About every 26 months","Every 10 years"],answer:2,explain:"Earth laps Mars about every 780 days (26 months). That's when launch windows open."},{level:"window",q:"How long did Mangalyaan take to fly from Earth to Mars?",options:["About 3 weeks","About 300 days","About 3 years","About 30 days"],answer:1,explain:"It left Earth orbit on 1 December 2013 and reached Mars on 24 September 2014, almost 300 days later."},{level:"marscapture",q:"Which country was the first to reach Mars orbit on its first try?",options:["USA","Russia","India","China"],answer:2,explain:"India's Mangalyaan reached Mars orbit on 24 September 2014, on the country's first attempt."},{level:"marscapture",q:"Mangalyaan was famous for being\u2026",options:["The heaviest Mars probe","Very low cost","The first Mars lander","Powered by nuclear energy"],answer:1,explain:"The mission cost about \u20B9450 crore (roughly US$74 million), famously less than the budget of the film Gravity."},{level:"terror",q:"Why is a Mars landing called 'seven minutes of terror'?",options:["The rover is scared","Radio signals take minutes to reach Earth, so it must land all by itself","Mars has storms every 7 minutes","The engines only last 7 minutes"],answer:1,explain:"Entry, parachute and landing take about 7 minutes, but radio needs several minutes to reach Earth. By the time we hear it started, it's already over."},{level:"terror",q:"What lowered Perseverance gently onto Mars?",options:["Airbags","A sky crane on cables","Landing legs","Just the parachute"],answer:1,explain:"A rocket-powered sky crane hovered and lowered the rover on 6.4 m cables, then flew away."},{level:"terror",q:"How thick is Mars' air compared with Earth's?",options:["About the same","About half","About 1%","Ten times thicker"],answer:2,explain:"Surface pressure on Mars is about 0.6% to 1% of Earth's. Parachutes help, but they can't land you alone."},{level:"slingshot",q:"How does a gravity assist speed up a spacecraft?",options:["The planet's magnetism pushes it","It borrows a tiny bit of the planet's orbital motion","Its engines fire near the planet","Sunlight pushes it"],answer:1,explain:"Passing behind a moving planet, the craft gets pulled along and gains speed. The planet slows by an immeasurably tiny amount."},{level:"slingshot",q:"Which is the only spacecraft to have visited Uranus and Neptune?",options:["Voyager 1","Voyager 2","Cassini","New Horizons"],answer:1,explain:"Voyager 2 flew past Uranus in 1986 and Neptune in 1989, after Jupiter and Saturn."},{level:"slingshot",q:"In which year was Voyager 2 launched?",options:["1969","1977","1990","2006"],answer:1,explain:"Voyager 2 launched on 20 August 1977. It is still sending data from interstellar space."},{level:"hop",q:"What did Vikram do on 3 September 2023, after landing?",options:["It drove 100 m","It hopped about 40 cm and landed again","It flew back to Earth","It switched off for good"],answer:1,explain:"Vikram fired its engines, rose about 40 cm and landed 30\u201340 cm away, showing it could lift off again from the Moon."},{level:"hop",q:"Why was the hop important for future missions?",options:["To take selfies","Missions that bring Moon samples back must lift off from the Moon","To escape a crater","To save fuel"],answer:1,explain:"Future sample-return and crewed missions must take off from the Moon. The hop proved the engines could restart there."},{level:"home13",q:"What went wrong on Apollo 13?",options:["It ran out of fuel","An oxygen tank exploded","It hit the Moon","The computer crashed"],answer:1,explain:"An oxygen tank exploded on the way to the Moon. The landing was cancelled and the crew flew around the Moon and home."},{level:"home13",q:"What happens if a capsule enters the air too shallowly?",options:["It lands softly","It can skip off the atmosphere back into space","It burns up","Nothing"],answer:1,explain:"Too shallow and it bounces off the top of the atmosphere, like a stone skipping on water. Too steep and it overheats."},{level:"home13",q:"Which spacecraft did the Apollo 13 crew use as a lifeboat?",options:["The Lunar Module Aquarius","Skylab","The Saturn V rocket","Soyuz"],answer:0,explain:"The crew moved into the Lunar Module Aquarius and used its engine and supplies to get home."},{level:"escape",q:"How fast must something go to escape Earth's gravity from its surface?",options:["1.1 km/s","11.2 km/s","112 km/s","300,000 km/s"],answer:1,explain:"Escape speed at Earth's surface is about 11.2 km/s, roughly 40,000 km/h. Higher up it is a little less."},{level:"escape",q:"Why did Mangalyaan circle Earth for almost a month before leaving?",options:["To wait for good weather","Its rocket was small, so it raised its orbit step by step","To take photos of Earth","To charge its batteries"],answer:1,explain:"The PSLV rocket put it in an Earth orbit. Mangalyaan then fired its engine at perigee several times to build up speed before escaping."},{level:"general",q:"Which planet is closest to the Sun?",options:["Venus","Mercury","Mars","Earth"],answer:1,explain:"Mercury orbits closest to the Sun, at about 58 million km."},{level:"general",q:"Which is the largest planet?",options:["Saturn","Earth","Jupiter","Neptune"],answer:2,explain:"Jupiter is so big that more than 1,300 Earths could fit inside it."},{level:"general",q:"What is the Sun?",options:["A planet","A star","A moon","A comet"],answer:1,explain:"The Sun is a star: a giant ball of hot gas powered by nuclear fusion."},{level:"general",q:"About how long does sunlight take to reach Earth?",options:["8 seconds","8 minutes","8 hours","8 days"],answer:1,explain:"Light takes about 8 minutes 20 seconds to travel the 150 million km from the Sun."},{level:"general",q:"Who was the first human in space?",options:["Neil Armstrong","Yuri Gagarin","Rakesh Sharma","Valentina Tereshkova"],answer:1,explain:"Yuri Gagarin orbited Earth on 12 April 1961."},{level:"general",q:"Who was the first Indian in space?",options:["Kalpana Chawla","Rakesh Sharma","Sunita Williams","Vikram Sarabhai"],answer:1,explain:"Rakesh Sharma flew on a Soviet Soyuz in April 1984."},{level:"general",q:"Which planet is known as the Red Planet?",options:["Jupiter","Venus","Mars","Mercury"],answer:2,explain:"Iron oxide (rust) in its dust makes Mars look red."},{level:"general",q:"How many planets are in our Solar System?",options:["7","8","9","10"],answer:1,explain:"There are eight planets. Pluto has been classed as a dwarf planet since 2006."},{level:"general",q:"What was India's first satellite?",options:["Rohini","Aryabhata","INSAT-1A","Bhaskara"],answer:1,explain:"Aryabhata was launched on 19 April 1975 by a Soviet rocket."},{level:"general",q:"Where is India's main rocket launch centre?",options:["Thiruvananthapuram","Sriharikota","Bengaluru","Ahmedabad"],answer:1,explain:"The Satish Dhawan Space Centre is at Sriharikota in Andhra Pradesh."},{level:"general",q:"Which is the hottest planet?",options:["Mercury","Venus","Mars","Jupiter"],answer:1,explain:"Venus's thick carbon-dioxide air traps heat, making it hotter than Mercury."},{level:"general",q:"What does a light-year measure?",options:["Time","Distance","Brightness","Speed"],answer:1,explain:"A light-year is the distance light travels in one year: about 9.5 trillion km."},{level:"general",q:"What keeps the Moon in orbit around Earth?",options:["Magnetism","Gravity","Air","Sunlight"],answer:1,explain:"Earth's gravity keeps pulling the Moon, so it keeps falling around us instead of flying off."},{level:"general",q:"Who was the first person to walk on the Moon?",options:["Buzz Aldrin","Neil Armstrong","Yuri Gagarin","Michael Collins"],answer:1,explain:"Neil Armstrong stepped onto the Moon on 20 July 1969 (21 July in UTC)."},{level:"general",q:"Which is the largest moon in the Solar System?",options:["Titan","Our Moon","Ganymede","Europa"],answer:2,explain:"Jupiter's moon Ganymede is even bigger than the planet Mercury."},{level:"general",q:"What does Aditya-L1 study?",options:["The Moon","Mars","The Sun","Saturn"],answer:2,explain:"Aditya-L1 watches the Sun from the L1 point, 1.5 million km from Earth."},{level:"general",q:"About how fast must you go to stay in orbit just above Earth?",options:["0.8 km/s","7.8 km/s","78 km/s","780 km/s"],answer:1,explain:"About 7.8 km/s, roughly 28,000 km/h. Fast enough that you keep falling around the curve of Earth."},{level:"general",q:"Why do we always see the same side of the Moon?",options:["The Moon doesn't spin","It spins once for every orbit","Earth blocks the other side","It's a coincidence"],answer:1,explain:"The Moon is tidally locked: it turns once on its axis each time it orbits Earth."},{level:"general",q:"Which planet has the biggest, brightest rings?",options:["Jupiter","Uranus","Saturn","Neptune"],answer:2,explain:"Saturn's rings are made of ice and rock, from tiny grains to house-sized chunks."},{level:"general",q:"What do astronauts feel in orbit?",options:["No gravity at all","Weightless, because they are falling","Heavier than on Earth","Pushed by the wind"],answer:1,explain:"Gravity is still about 90% as strong in low orbit. Astronauts float because they and their spacecraft are falling together."},{level:"earthrise",q:"Which mission took the famous 'Earthrise' photo?",options:["Apollo 8","Apollo 11","Voyager 1","Chandrayaan-1"],answer:0,explain:"Apollo 8, the first crewed flight around the Moon, in December 1968."},{level:"eagle",q:"What was the Apollo 11 lunar module called?",options:["Columbia","Eagle","Falcon","Aquarius"],answer:1,explain:"The lunar module was Eagle; the command module that stayed in orbit was Columbia."},{level:"rohini",q:"Which rocket gave India its first satellite launch from Indian soil?",options:["PSLV","SLV-3","GSLV","LVM3"],answer:1,explain:"SLV-3 put Rohini into orbit on 18 July 1980."},{level:"cassini",q:"What did Cassini drop onto Saturn's moon Titan?",options:["A rover","The Huygens probe","A flag","Nothing"],answer:1,explain:"The European Huygens probe landed on Titan in January 2005: the farthest landing ever made."},{level:"mip",q:"What is the Moon Impact Probe's crash site called?",options:["Shiv Shakti Point","Jawahar Point","Tiranga Point","Vikram Point"],answer:1,explain:"Chandrayaan-1's probe hit near Shackleton crater on 14 November 2008, at Jawahar Point."},{level:"pluto",q:"What shape is the famous bright region on Pluto?",options:["A star","A heart","A circle","A triangle"],answer:1,explain:"The heart-shaped plain is called Tombaugh Regio, after Pluto's discoverer Clyde Tombaugh."},{level:"juno",q:"Juno is named after a goddess who could see through\u2026",options:["Walls","Clouds","Water","Mountains"],answer:1,explain:"In myth, Juno saw through the clouds Jupiter hid behind. The spacecraft also peers beneath Jupiter's clouds."},{level:"sats104",q:"How many satellites did PSLV-C37 launch in one flight?",options:["10","42","104","1,000"],answer:2,explain:"104 satellites on 15 February 2017, a world record at the time."},{level:"spa
