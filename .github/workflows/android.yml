# Builds the ECHO DRIFT Android app on GitHub's servers.
# - Every push to main (or "Run workflow" on the Actions tab): tests + APK, downloadable from the run page.
# - Pushing a tag like v1.0.1: also publishes the APK on the Releases page (easy to open on a phone).
name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Test (physics, content, balance, solvable levels)
        run: npm test

      - name: Build game and copy into Android project
        run: npm run build && npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EchoDrift-${{ github.ref_name }}.apk

      - name: Upload APK (download from this run's page)
        uses: actions/upload-artifact@v4
        with:
          name: EchoDrift-apk
          path: EchoDrift-*.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EchoDrift-*.apk
          body: |
            Install on Android: download the .apk below on your phone, open it, and allow "Install unknown apps" when asked.
            This is a debug build (fine for testing; use a signed release AAB for Google Play).
