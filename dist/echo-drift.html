/* Buttons — min 48px targets */
.btn { min-height: 48px; min-width: 48px; padding: 12px 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel-strong); cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .08s, background .2s; touch-action: manipulation; }

/* Title */
.title-wrap { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 18px; text-align: center; padding: 24px; }

.map { position: relative; flex: 1; min-height: 420px; border-radius: 20px; overflow: hidden; border: 1px solid var(--line); background: radial-gradient(70% 60% at 50% 60%, #241a5a, #0a0b20); }
.node { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; padding: 4px; min-width: 64px; min-height: 64px; }

.node .st { font-size: .7rem; color: var(--amber); }

@keyframes pulse { 50% { box-shadow: 0 0 34px currentColor, inset -8px -8px 14px rgba(0, 0, 0, .45); transform: scale(1.08); } }

/* HUD */
.hud { position: absolute; left: 0; right: 0; top: 0; padding: max(10px, env(safe-area-inset-top)) 12px 8px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; z-index: 3; }

.meter { display: flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 700; }

.meter.warn .fill { background: var(--amber); }
.meter.bad .fill { background: var(--danger); }
.hud-bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px max(12px, env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: center; z-index: 3; }
.indicator { padding: 6px 12px; border-radius: 12px; font-weight: 700; font-size: .85rem; background: rgba(0, 0, 0, .45); border: 1px solid var(--line); }
.indicator[data-s='orbiting'] { color: var(--ok); }
.indicator[data-s='escaping'] { color: var(--amber); }
.indicator[data-s='falling'] { color: var(--danger); }
.banner { position: absolute; left: 50%; top: 32%; transform: translate(-50%, -50%); z-index: 4; padding: 10px 16px; border-radius: 12px; background: rgba(10, 10, 30, .85); border: 1px solid var(--amber); color: var(--amber); font-weight: 700; text-align: center; max-width: 90%; }

/* Overlays */
.overlay { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(4, 4, 16, .55); }
.overlay.centered { align-items: center; padding: 16px; }
.modal { width: 100%; max-height: 92%; overflow: auto; background: linear-gradient(180deg, #1c1747, #0e0d26); border: 1px solid var(--line); border-radius: 22px; padding: 18px; box-shadow: var(--shadow); }
.dialogue { position: absolute; left: 0; right: 0; bottom: 0; z-index: 30; padding: 12px 12px max(14px, env(safe-area-inset-bottom)); display: flex; gap: 10px; align-items: flex-end; background: linear-gradient(0deg, rgba(4, 4, 16, .95), rgba(4, 4, 16, 0)); cursor: pointer; min-height: 40%; }
.portrait { width: 78px; height: 78px; flex: none; border-radius: 18px; overflow: hidden; border: 2px solid currentColor; background: #120f2c; }
.bubble { flex: 1; background: rgba(255, 255, 255, .08); border: 1px solid var(--line); border-radius: 16px 16px 16px 4px; padding: 12px 14px; }

.bubble .txt { font-size: 1.05rem; line-height: 1.4; min-height: 2.8em; }
.bubble .next { font-size: .75rem; color: var(--muted); text-align: right; margin-top: 4px; }
.toast { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 40; background: rgba(15, 12, 40, .95); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; max-width: 88%; text-align: center; box-shadow: var(--shadow); animation: fadein .2s; }

.coach .tip { background: rgba(10, 10, 30, .9); border: 1px solid var(--teal); color: var(--text); padding: 6px 10px; border-radius: 10px; font-weight: 700; font-size: .9rem; white-space: nowrap; }
.coach.drag .hand { animation: dragdemo 1.6s ease-in-out infinite; }
.coach.tap .hand { animation: tapdemo 1.1s ease-in-out infinite; }
@keyframes dragdemo { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: 1; } 70% { transform: translate(var(--dx, 0), var(--dy, 60px)); opacity: 1; } 100% { transform: translate(var(--dx, 0), var(--dy, 60px)); opacity: 0; } }
@keyframes tapdemo { 50% { transform: scale(.85); } }

/* Investigation */
.scene { position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); }
.scene svg { width: 100%; height: 100%; display: block; }
.hotspot { position: absolute; transform: translate(-50%, -50%); width: 52px; height: 52px; border-radius: 50%; border: 2px dashed var(--teal); background: color-mix(in srgb, var(--teal) 14%, transparent); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: .65rem; font-weight: 700; color: #fff; text-shadow: 0 1px 3px #000; }

.palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.pm { min-height: 64px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .66rem; font-weight: 700; cursor: pointer; padding: 4px; text-align: center; }

.res { display: grid; grid-template-columns: 1fr; gap: 6px; }
.trend { width: 22px; text-align: center; font-weight: 700; }
.chain { display: flex; flex-direction: column; gap: 6px; }

canvas.chart { width: 100%; height: 180px; border-radius: 14px; background: #0c0b22; border: 1px solid var(--line); touch-action: none; }

/* Logbook / settings */

.bar-row { display: flex; align-items: center; gap: 8px; }
.bar-row .track { flex: 1; height: 12px; border-radius: 6px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.bar-row .fill { height: 100%; background: var(--teal); }
.err { border: 1px solid var(--danger); border-radius: 12px; padding: 12px; background: rgba(255, 60, 80, .08); font-family: ui-monospace, monospace; font-size: .8rem; white-space: pre-wrap; }

@media print {

  .no-print { display: none !important; }

  #app { height: auto; max-width: none; }
  .card { border-color: #999; background: #fff; }
}

",world:"cinder",title:"Catch an Orbit",brief:"You're coasting past Cinder. Slow down at the right moment and you'll keep falling around it: that's an orbit.",bounds:{w:600,h:1e3},bodies:[{id:"cinder",type:"planet",name:"Cinder",mass:6e4,radius:46,x:300,y:470,color:"#ff8a3d"}],ship:{x:30,y:640,vx:30,vy:-6},objective:{type:"orbit",target:"cinder",rMin:80,rMax:190,hold:6},fuel:45,maxDvPerBurn:30,maxBurns:3,maxTime:70,timeScale:1.4,hazards:{debris:[{x:470,y:300,r:9},{x:500,y:340,r:7},{x:150,y:250,r:8}]},goals:{fuelLeftPct:50,hull:100,time:25},hints:["Tap COAST to watch first. Burn backwards when you're closest to Cinder.","Watch the indicator: you want it to say ORBITING, not ESCAPING."],concepts:["orbits-falling","gravity-distance"],fact:"f-orbit-falling"},{id:"veil-1",world:"veil",title:"Skim the Haze",brief:"You're coming in way too fast to stop with fuel. Dip into Veil's thick air to slow down, but not too deep!",bounds:{w:600,h:1e3},bodies:[{id:"veil",type:"planet",name:"Veil",mass:8e4,radius:50,x:300,y:520,color:"#d6c75a"}],atmospheres:[{body:"veil",height:46,density:.03,scaleHeight:11}],heatLimit:75,ship:{x:40,y:60,vx:26,vy:30},objective:{type:"aerobrake",target:"veil",rMin:55,rMax:320,hold:4,strict:!0},fuel:14,maxDvPerBurn:14,maxBurns:2,maxTime:70,timeScale:1.3,goals:{fuelLeftPct:50,hull:80,time:30},hints:["Aim your path so it grazes the glowing haze, not the planet.","Too much heat? Your path is too deep. Nudge it outward a little."],concepts:["atmosphere-drag","orbits-falling"],fact:"f-aerobraking"},{id:"veil-2",world:"veil",title:"Two-Burn Transfer",brief:"Climb from a low orbit up to the Orrin relay ring using as little fuel as possible.",bounds:{w:600,h:1e3},bodies:[{id:"veil",type:"planet",name:"Veil",mass:8e4,radius:50,x:300,y:500,color:"#d6c75a"},{id:"relay",type:"station",name:"Orrin relay",mass:0,drawRadius:9,color:"#3ff0d2",orbit:{parent:"veil",radius:220,phaseDeg:300}}],atmospheres:[{body:"veil",height:20,density:.01,scaleHeight:8}],ship:{orbit:{body:"veil",radius:95,phaseDeg:90}},objective:{type:"hohmann",target:"veil",rMin:195,rMax:250,hold:6,strict:!0},fuel:18,maxDvPerBurn:12,maxBurns:3,maxTime:100,timeScale:1.8,hazards:{gusts:[{start:14,duration:2.5,angleDeg:0,accel:1.2}]},goals:{fuelLeftPct:30,hull:100,time:40},hints:["Burn FORWARD (the way you're moving). That raises the far side of your orbit.","Coast to the highest point, then burn forward again to round out the orbit."],concepts:["hohmann","orbits-falling"],fact:"f-hohmann"},{id:"hollow-1",world:"hollow",title:"The Calm Spot",brief:"Ahead of Hollow on its orbit there's a place where the star's and planet's pulls balance out. Park there.",bounds:{w:800,h:1e3},bodies:[{id:"sun",type:"star",name:"Orrin's star",mass:6e5,radius:42,x:400,y:500,color:"#ff6b5b"},{id:"hollow",type:"planet",name:"Hollow",mass:9e3,radius:20,color:"#8f7bff",orbit:{parent:"sun",radius:300,phaseDeg:180}}],ship:{orbit:{body:"sun",radius:300,phaseDeg:140}},objective:{type:"lagrange",planet:"hollow",point:"L4",r:48,hold:6},fuel:30,maxDvPerBurn:20,maxBurns:3,maxTime:80,timeScale:1.6,hazards:{flares:[{start:3,duration:5}]},goals:{fuelLeftPct:40,hull:100,time:35},hints:["The calm spot moves with Hollow. Match its speed rather than chasing it hard.","Small burns! Being close and slow beats being fast."],concepts:["lagrange","gravity-pull"],fact:"f-lagrange"},{id:"hollow-2",world:"hollow",title:"Edge of the Dark",brief:"An Orrin probe orbits a black hole just ahead of you. To catch up, you have to slow down. Really!",bounds:{w:600,h:1e3},bodies:[{id:"bh",type:"blackhole",name:"Black hole",mass:12e4,horizon:28,x:300,y:500,color:"#000000"},{id:"probe",type:"probe",name:"Orrin probe",mass:0,drawRadius:8,color:"#ffc04d",orbit:{parent:"bh",radius:170,phaseDeg:0}}],ship:{orbit:{body:"bh",radius:170,phaseDeg:-55}},objective:{type:"rendezvous",target:"probe",r:26,maxRelSpeed:12},fuel:40,maxDvPerBurn:25,maxBurns:4,maxTime:120,timeScale:2,goals:{fuelLeftPct:35,hull:100,time:70},hints:["Burning backward drops you into a lower, FASTER orbit, so you'll gain on the probe.","When you're close, burn to match the probe's speed."],concepts:["orbits-falling","black-holes"],fact:"f-black-hole"},{id:"hollow-3",world:"hollow",title:"Leave Hollow",brief:"Time to go. Break free of Hollow's gravity with the least fuel you can.",bounds:{w:600,h:1e3,margin:600},bodies:[{id:"hollow",type:"planet",name:"Hollow",mass:7e4,radius:40,x:300,y:600,color:"#8f7bff"}],ship:{orbit:{body:"hollow",radius:72,phaseDeg:0}},objective:{type:"escape",target:"hollow",distance:480},fuel:24,maxDvPerBurn:24,maxBurns:2,maxTime:60,timeScale:1.4,hazards:{flares:[{start:6,duration:4}]},goals:{fuelLeftPct:35,hull:100,time:25},hints:["Burn in the direction you're already moving. You keep the speed you already have.","Pointing straight away from the planet wastes fuel."],concepts:["escape-velocity"],fact:"f-escape-velocity"}];var qt={cinder:{world:"cinder",charges:4,answer:"impact",scene:{sky:"#2a1030",ground:"#5a2a1c",features:[{type:"crater",x:.18,w:.3},{type:"cliff",x:.62,w:.18},{type:"vent",x:.85,w:.08},{type:"ruin",x:.45,w:.16}]},hotspots:[{id:"basin",label:"Giant basin",x:.18,y:.66},{id:"cliff",label:"Layered cliff",x:.66,y:.52},{id:"vents",label:"Warm vents",x:.86,y:.68},{id:"city",label:"Orrin ruins",x:.45,y:.6},{id:"sky",label:"Sky",x:.5,y:.18}],clues:[{id:"c-crater",hotspot:"basin",tool:"crater",title:"Huge round crater",data:"Basin 62 km wide. Rock was thrown out to the north-east, so the hit came from the south-west.",dataCadet:"A giant round hole. Rock was thrown out all on one side, like a splash!",weights:{impact:3,volcanism:-1}},{id:"c-glass",hotspot:"basin",tool:"thermal",title:"Glass beads",data:"Tiny glass beads around the rim: rock that melted in a flash and froze in mid-air.",dataCadet:"Little glass beads everywhere. Something melted rock in an instant.",weights:{impact:2,volcanism:1}},{id:"c-iridium",hotspot:"cliff",tool:"drill",title:"Iridium spike",data:"A thin dark layer with 120\xD7 normal iridium, a metal rare in surface rock but common in asteroids.",dataCadet:"A thin dark stripe full of a rare metal that asteroids carry.",weights:{impact:3},opensLayers:!0},{id:"c-air",hotspot:"sky",tool:"spectrometer",title:"Ordinary air",data:"N\u2082 78%, O\u2082 19%, CO\u2082 0.9%. Thin, fairly ordinary air. Nothing that would trap lots of heat.",dataCadet:"The air is pretty normal. Not much heat-trapping gas.",weights:{greenhouse:-2},redHerring:!0},{id:"c-vents",hotspot:"vents",tool:"thermal",title:"Warm vents",data:"Vents at 60 \xB0C, but the rock below is old and cold. No fresh lava for ages.",dataCadet:"Warm steam, but the ground underneath is old and cold.",weights:{volcanism:1,impact:0},redHerring:!0},{id:"c-rad",hotspot:"city",tool:"radiation",title:"Normal radiation",data:"Radiation is normal for a world this far from its star.",dataCadet:"Radiation is normal here.",weights:{stellar:-1},redHerring:!0},{id:"c-rebuilt",hotspot:"city",tool:"drill",title:"Two cities",data:"One Orrin city lies BELOW the iridium layer. A second, rebuilt city lies ABOVE it.",dataCadet:"There's an old city under the dark stripe and a newer city on top!",weights:{impact:1}}],explanations:{impact:"The crater, glass beads and iridium layer all point to an asteroid strike.",greenhouse:"The air here is thin and ordinary, so it couldn't trap much heat.",stellar:"Radiation readings were normal, so the star wasn't the problem here. At least, not yet.",volcanism:"The vents are warm, but the rock below is old and cold. No big eruptions for ages.",unknown:"Fair! Saying 'we need more data' is real science. Mission Control will send what they know."},layers:{prompt:"Put the layers in order from TOP (newest) to BOTTOM (oldest).",layers:[{id:"l-rebuilt",label:"Rebuilt Orrin city",depth:"top"},{id:"l-impact",label:"Iridium + glass (the impact)",depth:"middle"},{id:"l-first",label:"First Orrin city",depth:"lower"},{id:"l-bedrock",label:"Ancient bedrock",depth:"bottom"}]},glyph:{prompt:"The Orrin count in dots. What comes next?",sequence:[1,3,5,7],answer:9,options:[8,9,11],fragment:"frag-cinder",style:"dots"},concepts:["superposition"]},veil:{world:"veil",charges:4,answer:"greenhouse",scene:{sky:"#5a5420",ground:"#7a5a2a",features:[{type:"clouds",x:.5,w:1},{type:"volcano",x:.78,w:.22},{type:"seabed",x:.3,w:.3},{type:"ruin",x:.55,w:.12}]},hotspots:[{id:"clouds",label:"Thick clouds",x:.3,y:.2},{id:"plains",label:"Cracked plains",x:.6,y:.72},{id:"seabed",label:"Dry basin",x:.28,y:.66},{id:"volcano",label:"Old volcano",x:.8,y:.5},{id:"salt",label:"Salt crust",x:.44,y:.78}],clues:[{id:"v-co2",hotspot:"clouds",tool:"spectrometer",title:"CO\u2082 blanket",data:"Atmosphere 96% CO\u2082, about 90\xD7 thicker than Earth's, with sulfuric-acid clouds.",dataCadet:"The air is almost all carbon dioxide, a gas that traps heat. And it's super thick!",weights:{greenhouse:3,volcanism:1}},{id:"v-heat",hotspot:"plains",tool:"thermal",title:"Oven world",data:"Surface 460 \xB0C, almost the same day and night, pole to equator. Heat is trapped everywhere.",dataCadet:"It's 460 \xB0C everywhere, day AND night. The heat can't escape.",weights:{greenhouse:3}},{id:"v-sea",hotspot:"seabed",tool:"drill",title:"Lost oceans",data:"Ripple marks and salt layers: this basin was a sea. The water is gone.",dataCadet:"Ripples and salt, so this was once a sea!",weights:{greenhouse:2}},{id:"v-clock",hotspot:"salt",tool:"radiation",title:"Isotope clock",data:"Radioactive clock in the salt: the seas dried up slowly over ~1 billion years while starlight kept rising.",dataCadet:"A natural clock in the salt says the seas dried slowly while the starlight got stronger.",weights:{greenhouse:2,stellar:2}},{id:"v-volc",hotspot:"volcano",tool:"thermal",title:"Sleeping volcano",data:"Cold summit. The lava flows are hundreds of millions of years old.",dataCadet:"The volcano is cold and asleep, and has been for ages.",weights:{volcanism:-1},redHerring:!0},{id:"v-sulfur",hotspot:"volcano",tool:"drill",title:"Sulfur rock",data:"Rocks rich in sulfur: volcanoes were active long ago.",dataCadet:"Smelly sulfur rocks. Volcanoes were busy long ago.",weights:{volcanism:1},redHerring:!0},{id:"v-craters",hotspot:"plains",tool:"crater",title:"Few craters",data:"Very few craters. Old lava paved over the surface long ago.",dataCadet:"Hardly any craters. Old lava covered them up.",weights:{volcanism:1,impact:-1},redHerring:!0}],explanations:{greenhouse:"Thick CO\u2082 traps heat, the oceans boiled away, and the salt clock shows it happened as the starlight rose. A runaway greenhouse.",impact:"There are hardly any craters, so no giant impact here.",stellar:"Close! The star's rising light started it, but what's cooking Veil now is its thick heat-trapping air.",volcanism:"Volcanoes added gas long ago, but they're cold now and can't explain heat that's still trapped today.",unknown:"Honest answer. Mission Control will send data that helps."},glyph:{prompt:"Orrin bars: | = 1, \u2016 = 2 \u2026 They count in twos (binary). What's next?",sequence:[1,2,3,4],answer:5,options:[5,6,8],fragment:"frag-veil",style:"binary"},concepts:["greenhouse"]},hollow:{world:"hollow",charges:4,answer:"stellar",scene:{sky:"#3a1028",ground:"#3b3350",features:[{type:"bigstar",x:.75,w:.35},{type:"dome",x:.3,w:.22},{type:"crater",x:.65,w:.12},{type:"tubes",x:.88,w:.1}]},hotspots:[{id:"star",label:"The star",x:.75,y:.2},{id:"crust",label:"Bleached crust",x:.55,y:.75},{id:"domes",label:"Shield domes",x:.3,y:.58},{id:"frost",label:"Crater frost",x:.66,y:.66},{id:"tubes",label:"Lava tubes",x:.9,y:.66}],clues:[{id:"h-dose",hotspot:"crust",tool:"radiation",title:"Radiation flood",data:"UV and X-ray dose 40\xD7 higher than the Orrin domes were designed for.",dataCadet:"WAY more harsh starlight than the Orrin buildings were made for.",weights:{stellar:3}},{id:"h-spectrum",hotspot:"star",tool:"spectrometer",title:"Changed star",data:"Today the star is larger, redder and brighter than in Orrin carvings.",dataCadet:"The star today is bigger and redder than in Orrin pictures.",weights:{stellar:3}},{id:"h-domes",hotspot:"domes",tool:"crater",title:"Rushed shields",data:"Shield domes built in a hurry, all facing the star.",dataCadet:"Shield domes built fast, all pointing at the star.",weights:{stellar:2}},{id:"h-sterile",hotspot:"crust",tool:"drill",title:"Sterile soil",data:"Soil sterilized 2 m down. Nothing survived near the surface.",dataCadet:"The soil is cleaned out deep down. Nothing could live there.",weights:{stellar:1}},{id:"h-frost",hotspot:"frost",tool:"thermal",title:"Last frost",data:"Ice survives only in permanently shadowed craters.",dataCadet:"The only ice left hides in dark crater shadows.",weights:{stellar:1,greenhouse:1}},{id:"h-air",hotspot:"star",tool:"radiation",title:"Air blown away",data:"Almost no air left, only thin traces of argon.",dataCadet:"Almost no air left at all.",weights:{greenhouse:-2,stellar:1}},{id:"h-small",hotspot:"frost",tool:"crater",title:"Small craters",data:"Only small craters. Nothing big enough to end a civilization.",dataCadet:"Only little craters here.",weights:{impact:-2},redHerring:!0},{id:"h-tubes",hotspot:"tubes",tool:"thermal",title:"Lava-tube shelters",data:"Old, cold lava tubes, used by the Orrin as shelters.",dataCadet:"Old lava tunnels the Orrin hid in.",weights:{volcanism:1},redHerring:!0}],explanations:{stellar:"The star itself changed. It grew brighter and redder until its light scoured Hollow clean.",greenhouse:"There's almost no air left to trap heat. Something stripped it away.",impact:"The craters are all small. Not a world-ending hit.",volcanism:"The lava tubes are ancient and cold. The Orrin just used them as shelter.",unknown:"Good instinct to wait for more data. Mission Control can help."},glyph:{prompt:"Numbers only divisible by 1 and themselves. What's next?",sequence:[2,3,5,7,11],answer:13,options:[12,13,15],fragment:"frag-hollow",style:"dots"},concepts:["star-change"]}};var Nt={ticksPerDay:10,daylight:.6,gridW:4,gridH:4,crew:4,crewPerHabitat:2,graceTicks:5,start:{power:20,water:28,oxygen:28,food:24,morale:70},caps:{power:20,water:100,oxygen:100,food:100,morale:100},crewNeeds:{oxygen:.5,water:.3,food:.25},wrongHypothesis:{startMult:.6,budgetCut:3},modules:[{id:"solar",name:"Solar panel",icon:"\u2600",cost:1,produces:{power:5},desc:"Makes power in daylight. Weaker the farther you are from the star."},{id:"battery",name:"Battery",icon:"\u25AE",cost:1,storage:60,desc:"Stores power for the night."},{id:"water",name:"Water extractor",icon:"\u{1F4A7}",cost:2,priority:2,consumes:{power:2},produces:{water:3.5},desc:"Pulls water from ice in the ground. Needs power."},{id:"greenhouse",name:"Greenhouse",icon:"\u{1F331}",cost:2,priority:3,consumes:{power:1.5,water:1.2},produces:{food:2,oxygen:1},desc:"Grows food and makes some oxygen. Needs water and power."},{id:"o2gen",name:"Oxygen generator",icon:"O\u2082",cost:2,priority:1,consumes:{power:2.5,water:.8},produces:{oxygen:2.6},desc:"Splits water into oxygen. Needs water and power."},{id:"habitat",name:"Habitat pod",icon:"\u2302",cost:1,desc:"Home for 2 crew. Crowded crews get grumpy."},{id:"comms",name:"Comms dish",icon:"\u{1F4E1}",cost:1,priority:4,consumes:{power:.8},desc:"Keeps crew in touch with home (morale) and warns of storms."},{id:"shield",name:"Radiation shield",icon:"\u{1F6E1}",cost:1,priority:5,consumes:{power:.8},protects:.5,onlyWorlds:["hollow"],desc:"Protects solar panels from harsh starlight. Two shields = full cover."}],worlds:[{id:"cinder",solar:1,days:4,budget:15,events:[{id:"dust",day:3,days:1,solarMult:.4}],note:"Cinder gets about as much sunlight as Earth."},{id:"veil",solar:.55,days:5,budget:16,events:[{id:"acidstorm",day:2,days:2,solarMult:.5,morale:-.2},{id:"heatwave",day:4,days:1,extraPower:1.2}],note:"Veil is closer to its star, but the thick clouds block much of the light."},{id:"hollow",solar:1.8,days:5,budget:16,events:[{id:"flare",day:2,days:1,radiation:.03,morale:-.3},{id:"flare2",day:4,days:1,radiation:.03}],note:"Hollow's swollen star is bright: lots of power, but its radiation wrecks unshielded panels."}]};var Dt={cinder:{world:"cinder",questions:[{id:"q1",speaker:"tobo",q:'Tobo floats in the cabin: "See? No gravity in space!" Is he right?',options:["Yes, space has zero gravity","No, gravity is still pulling. We're just falling around Cinder together","Only on Tuesdays"],correct:1,misconception:"There is no gravity in space.",feedback:"Gravity reaches far into space. Astronauts float because they and their ship are falling together, all the time.",concept:"orbits-falling"},{id:"q2",speaker:"asha",q:"If we flew twice as far from Cinder, its pull on us would be\u2026",options:["Half as strong","A quarter as strong","The same"],correct:1,misconception:"Gravity weakens in a straight line with distance.",feedback:"Double the distance, a quarter the pull. That's the inverse-square law!",concept:"gravity-distance"},{id:"q3",speaker:"kiran",q:"Which rock layer formed FIRST?",options:["The top one","The bottom one","They all formed at once"],correct:1,misconception:"Rock layers have no time order.",feedback:"New layers pile on top of old ones, so in undisturbed rock, deeper means older.",concept:"superposition"}]},veil:{world:"veil",questions:[{id:"q1",speaker:"kiran",q:"Veil is hotter than the planet closest to its star. Why?",options:["It's closer to the star","Its thick CO\u2082 air traps heat","Its core is on fire"],correct:1,misconception:"Only distance from the star sets a planet's temperature.",feedback:"The air matters as much as the distance. In our Solar System, Venus is hotter than Mercury for the same reason.",concept:"greenhouse"},{id:"q2",speaker:"tobo",q:'"Greenhouse gases are always bad!" says Tobo. Hmm?',options:["True, any amount is bad","No. A little keeps a planet warm enough for life, too much overheats it","They don't affect temperature"],correct:1,misconception:"Any greenhouse effect is harmful.",feedback:"Without any greenhouse effect, Earth would be frozen. It's all about balance.",concept:"greenhouse"},{id:"q3",speaker:"asha",q:"Why did skimming the haze slow us down?",options:["Air pushes back on fast-moving things","Clouds are sticky","The haze has extra gravity"],correct:0,misconception:"Atmosphere doesn't affect spacecraft.",feedback:"That push-back is drag. Real Mars orbiters used it to save fuel (aerobraking).",concept:"atmosphere-drag"}]},hollow:{world:"hollow",questions:[{id:"q1",speaker:"mc1",q:'MC-1: "When you look at a star 38 light-years away, you see it\u2026"',options:["As it is right now","As it was 38 years ago","As it will be in 38 years"],correct:1,misconception:"We see stars as they are at this moment.",feedback:"Light needs time to travel. Starlight is a message from the past.",concept:"light-delay"},{id:"q2",speaker:"kiran",q:"What will our Sun do in about 5 billion years?",options:["Explode as a supernova","Swell into a red giant, then shrink to a white dwarf","Turn into a black hole"],correct:1,misconception:"All stars explode or become black holes.",feedback:"Only very massive stars go supernova. The Sun will become a red giant, then a white dwarf. And 5 billion years is a LONG time.",concept:"star-change"},{id:"q3",speaker:"tobo",q:"To escape a planet using the least fuel, Tobo should burn\u2026",options:["Straight away from the planet","In the direction he's already moving","Toward the planet"],correct:1,misconception:"The best way out is straight up.",feedback:"Burning forward adds to the speed you already have. Rockets launch sideways into orbit for the same reason.",concept:"escape-velocity"}]}};var Wt={ruler:[{id:"moon",label:"Earth \u2192 Moon",seconds:1.28},{id:"sun",label:"Sun \u2192 Earth",seconds:499},{id:"neptune",label:"Sun \u2192 Neptune",seconds:14960},{id:"proxima",label:"Nearest star (Proxima)",seconds:1338e5},{id:"orrin",label:"Earth \u2192 Orrin system",seconds:1199e6}],cinder:{questions:[{id:"q-asteroids",label:"Is the Orrin system full of asteroids?",answer:"Yes. Our telescopes see a big asteroid belt there. Big impacts were probably common long ago.",unlocks:"f-iridium"},{id:"q-star",label:"What kind of star is it?",answer:"A star a little older than our Sun. Our archive photos are 38 years old, of course.",unlocks:"f-light-past"},{id:"q-signal",label:"Did you hear the signal too?",answer:"We picked it up after you left. It repeats every 1.4 seconds\u2026 or does it?",unlocks:null},{id:"q-weather",label:"Any cricket scores?",answer:"Your question took 38 years to reach us, so that match finished decades ago. Nice try, Tobo.",unlocks:null}],unknownReveal:"Our analysis of your data: the iridium layer and crater mean an asteroid impact. But that's not what ended the Orrin.",signal:{prompt:"Combine the crew's readings. What's sending the signal?",readings:[{crew:"asha",label:"Pulse period",value:"Exactly 1.40 s, every time"},{crew:"kiran",label:"Pattern",value:"Pulses grouped 2, 3, 5, 7\u2026 primes!"},{crew:"tobo",label:"Brightness",value:"Weak, steady, from one moving point"}],options:[{id:"pulsar",label:"Pulsar (spinning dead star)",why:"Pulsars tick very regularly, but they don't count in prime numbers."},{id:"probe",label:"Orrin probe",why:"Regular timing PLUS a prime-number pattern = made by someone. It's an Orrin probe!"},{id:"accretion",label:"X-rays from gas falling into a black hole",why:"That glow flickers randomly. No neat pattern."},{id:"flare",label:"Flare star",why:"Flares burst at random, not on a perfect beat."}],answer:"probe"}},veil:{questions:[{id:"q-venus",label:"Is there a world like Veil near home?",answer:"Yes, Venus! 96% CO\u2082 and hotter than Mercury, even though it's farther from the Sun.",unlocks:"f-venus"},{id:"q-bright",label:"Do stars get brighter as they age?",answer:"Yes. Sun-like stars slowly brighten. When our Sun was young it shone about 30% dimmer than it does today.",unlocks:"f-sun-brightening"},{id:"q-oceans",label:"Could oceans really boil away?",answer:"If a planet gets hot enough, water vapour rises high and is split apart by starlight. Then the hydrogen escapes to space.",unlocks:null},{id:"q-snack",label:"Can you send snacks?",answer:"Shipped! ETA: 76 years. Please share with Tobo.",unlocks:null}],unknownReveal:"Your data shows thick CO\u2082, lost oceans and trapped heat: a runaway greenhouse, triggered by a brightening star.",signal:{prompt:"A new signal from deep space. What is it?",readings:[{crew:"asha",label:"Pulse period",value:"0.033 s, precise as an atomic clock"},{crew:"kiran",label:"Pattern",value:"No message, just ticks"},{crew:"tobo",label:"Source",value:"Tiny, super-dense object in a gas cloud"}],options:[{id:"pulsar",label:"Pulsar (spinning dead star)",why:"A super-precise, super-fast tick from a tiny dense object: a pulsar, the core left over from an exploded star."},{id:"probe",label:"Orrin probe",why:"No message pattern this time. It's natural."},{id:"accretion",label:"X-rays from gas falling into a black hole",why:"That glow flickers; it doesn't tick perfectly."},{id:"flare",label:"Flare star",why:"Flares don't repeat 30 times a second!"}],answer:"pulsar"}},hollow:{questions:[{id:"q-redgiant",label:"What happens when a star like this ages?",answer:"It swells into a red giant, hundreds of times wider, and scorches its inner planets.",unlocks:"f-red-giant"},{id:"q-sun",label:"Will our Sun do this too?",answer:"Yes, but in about 5 billion years. Humans have only been around for 300,000. There's lots of time to learn and explore.",unlocks:"f-sun-future"},{id:"q-flare",label:"Can flares hurt spacecraft?",answer:"Big flares and the particle storms that follow them can damage electronics and solar panels. Real missions watch space weather.",unlocks:"f-cme"},{id:"q-tobo",label:"Tobo wants to know if he's a good robot",answer:"Tobo, by the time this arrives you'll have been a good robot for 76 more years.",unlocks:null}],unknownReveal:"Your readings show a star that grew brighter and swelled. The star itself is the cause.",signal:{prompt:"The black hole region glows. What's making the light?",readings:[{crew:"asha",label:"Timing",value:"Random flickers, no beat"},{crew:"kiran",label:"Light type",value:"Very strong X-rays"},{crew:"tobo",label:"Source",value:"A hot swirling disk around a dark centre"}],options:[{id:"pulsar",label:"Pulsar (spinning dead star)",why:"Pulsars tick regularly. This flickers randomly."},{id:"probe",label:"Orrin probe",why:"There's no pattern or message here."},{id:"accretion",label:"X-rays from gas falling into a black hole",why:"Right! The black hole itself is dark. The X-rays come from gas heated to millions of degrees as it swirls in."},{id:"flare",label:"Flare star",why:"No star is visible at the centre, just a dark spot."}],answer:"accretion"}},planetHunter:{cinder:{nextWorld:"veil",span:30,planets:[{id:"a",period:4.2,depth:.004,phase:1,duration:.35},{id:"b",period:9.5,depth:.012,phase:3,duration:.5}],target:"b",candidates:[{id:"a",label:"Small world, 4-day year"},{id:"b",label:"Bigger world, 9.5-day year"},{id:"c",label:"Giant world, 20-day year"}]},veil:{nextWorld:"hollow",span:40,planets:[{id:"a",period:6,depth:.008,phase:2,duration:.4},{id:"b",period:14,depth:.005,phase:5,duration:.6}],target:"b",candidates:[{id:"a",label:"Bigger world, 6-day year"},{id:"b",label:"Smaller world, 14-day year"},{id:"c",label:"Tiny world, 2-day year"}]},hollow:{nextWorld:"tides",span:40,planets:[{id:"a",period:11,depth:.02,phase:4,duration:.7}],target:"a",candidates:[{id:"a",label:"Big world, 11-day year"},{id:"b",label:"Small world, 3-day year"},{id:"c",label:"Giant world, 30-day year"}]}}};var Ht={ingredients:[{id:"H",name:"Hydrogen",color:"#7fd3ff",desc:"The main fuel. Stars fuse it into helium."},{id:"He",name:"Helium",color:"#ffe27a",desc:"What hydrogen becomes. Old stars burn it next."},{id:"C",name:"Carbon",color:"#a0a0a0",desc:"Made inside ageing stars. It's in you, too!"},{id:"O",name:"Oxygen",color:"#8affc1",desc:"Forged in stars and spread by dying ones."},{id:"Fe",name:"Iron",color:"#c46a4a",desc:"Hmm\u2026 stars really don't like this one."}],massMin:.05,massMax:40,types:{browndwarf:{name:"Brown dwarf",color:"#8a4b3a",joke:"Too small to ignite. It's basically a very warm potato."},reddwarf:{name:"Red dwarf",color:"#ff6a4d",joke:"Small, cosy and slow-cooked. It'll simmer for TRILLIONS of years."},sunlike:{name:"Sun-like star",color:"#ffd25e",joke:"Golden brown, done to perfection. Chef's kiss!"},whitestar:{name:"Hot white star",color:"#e9f1ff",joke:"Extra crispy. Bright, but it won't last as long."},bluegiant:{name:"Blue giant",color:"#7fb2ff",joke:"WAY too much heat! Lives fast, ends with a BANG."}},stages:{reddwarf:"Red dwarf: burns slowly for trillions of years",slowfade:"Slowly runs out of fuel\u2026 longer than the universe has existed so far",whitedwarf:"White dwarf: a hot, Earth-sized leftover core that cools forever",sunlike:"Main sequence: steady, slowly brightening, for about 10 billion years",whitestar:"Main sequence: hot and bright, for under a billion years",bluegiant:"Main sequence: blazing, for only a few million years",redgiant:"Red giant: the core runs low on hydrogen and the star swells hundreds of times wider",nebula:"Planetary nebula: outer layers drift away as a glowing shell",supergiant:"Supergiant: fuses heavier elements, all the way up to iron",supernova:"Supernova: the iron core collapses and the star explodes",neutronstar:"Neutron star: a city-sized ball, denser than anything on Earth",blackhole:"Black hole: gravity so strong that not even light escapes",browndwarf:"Never ignites. Not quite a star."},brightenPerGyr:{sunlike:.1,whitestar:.25,reddwarf:0,bluegiant:.4},ironFizzle:"FZZZT! Fusing iron takes energy instead of giving it out. That's why a big star's iron core collapses!",worlds:{cinder:{requirement:{types:["sunlike"],minHydrogen:2},goal:"The jump drive needs a steady, Sun-like star to lock onto.",success:"Jump drive locked on! Next stop: Veil."},veil:{requirement:{types:["reddwarf"],minHydrogen:2},goal:"Tobo wants a calm, long-lasting star to recharge slowly.",success:"Slow and steady. Recharged. Hollow, here we come."},hollow:{requirement:{types:["sunlike"],minHydrogen:2},goal:"Forge a star like the Orrin's, then watch its whole life.",success:"Now we know what the Orrin saw coming."}}};var Ft={speakers:{asha:{name:"Captain Asha",color:"#3ff0d2"},kiran:{name:"Dr. Kiran",color:"#ffc04d"},tobo:{name:"Tobo",color:"#ff5fa2"},mc1:{name:"MC-1 (Earth)",color:"#9fb3ff"},orrin:{name:"Orrin message",color:"#c9a7ff"}},prologue:[{id:"p1",s:"mc1",m:"calm",t:"Echo Drift, this is Mission Control. Thirty-eight years ago a star system started sending a signal."},{id:"p2",s:"kiran",m:"excited",t:"A signal with a PATTERN. Someone made it."},{id:"p3",s:"tobo",m:"happy",t:"And we're the lucky crew who gets to find out who! Beep."},{id:"p4",s:"asha",m:"determined",t:"Strap in. First stop: Cinder."}],worlds:{cinder:{intro:[{id:"ci1",s:"asha",m:"determined",t:"Cinder. Scorched, cratered\u2026 and covered in ruins."},{id:"ci2",s:"kiran",m:"excited",t:"The signal's strongest here. Let's get down there!"},{id:"ci3",s:"tobo",m:"happy",t:"Fuel is limited, so let gravity do the work. I read that in a manual. Once."}],afterFly:[{id:"cf1",s:"asha",m:"happy",t:"Touchdown. Kiran, grab the scanners. We've only got a few charges."}],correct:[{id:"cc1",s:"kiran",m:"excited",t:"An asteroid hit Cinder. But look: they REBUILT on top of it!"},{id:"cc2",s:"asha",m:"thinking",t:"So the impact didn't end them. Something bigger did."}],wrong:[{id:"cw1",s:"tobo",m:"sad",t:"Oops. We packed for the wrong danger. Supplies will be tight."}],unknown:[{id:"cu1",s:"kiran",m:"thinking",t:"Not sure yet? Good. Let's ask Earth and keep watching."}],afterBuild:[{id:"cb1",s:"tobo",m:"happy",t:"Everyone's alive! Including me, the most important crew member."}],afterReport:[{id:"cr1",s:"asha",m:"determined",t:"That light-curve dip points to the next Orrin world. Let's power the jump."}],outro:[{id:"co1",s:"orrin",m:"calm",t:'Fragment 1: "WE SURVIVED THE FALLING STONE."',if:"glyphSolved"},{id:"co2",s:"kiran",m:"thinking",t:"If they survived that\u2026 what got them in the end?"}]},veil:{intro:[{id:"vi1",s:"kiran",m:"worried",t:"Veil's surface is hot enough to melt lead."},{id:"vi2",s:"tobo",m:"happy",t:"Good news: no fuel needed to slow down! Bad news: we use the air instead."},{id:"vi3",s:"asha",m:"determined",t:"Skim the haze. Not too deep."}],afterFly:[{id:"vf1",s:"kiran",m:"excited",t:"We're in! Scanners up. Those clouds look\u2026 suspicious."}],correct:[{id:"vc1",s:"kiran",m:"thinking",t:"A runaway greenhouse. But it wasn't their factories. Their STAR got brighter."},{id:"vc2",s:"asha",m:"worried",t:"The safe zone around the star moved outward\u2026 and left Veil behind."}],wrong:[{id:"vw1",s:"tobo",m:"sad",t:"We built for the wrong problem. The base starts low on supplies."}],unknown:[{id:"vu1",s:"asha",m:"thinking",t:"Mixed evidence. We'll ask Earth."}],afterBuild:[{id:"vb1",s:"tobo",m:"happy",t:"Survived the acid storm. My paint job did not."}],afterReport:[{id:"vr1",s:"kiran",m:"excited",t:"Another dip in the starlight. Another world. Let's go."}],outro:[{id:"vo1",s:"orrin",m:"calm",t:'Fragment 2: "OUR SKY GREW WARMER. THE LIGHT GREW STRONGER."',if:"glyphSolved"},{id:"vo2",s:"asha",m:"thinking",t:"The light grew stronger\u2026 they're telling us about their star."}]},hollow:{intro:[{id:"hi1",s:"asha",m:"worried",t:"Hollow. Look at that star. It's huge."},{id:"hi2",s:"kiran",m:"thinking",t:"And there's a black hole nearby with an Orrin probe orbiting it."},{id:"hi3",s:"tobo",m:"happy",t:"Don't worry. I've never been sucked into a black hole. Yet."}],afterFly:[{id:"hf1",s:"kiran",m:"excited",t:"The probe's data is the last piece. Let's scan the surface."}],correct:[{id:"hc1",s:"kiran",m:"worried",t:"It was the star all along. It aged, brightened, and swelled."},{id:"hc2",s:"asha",m:"thinking",t:"Stars like ours do this. Our Sun will too\u2026"},{id:"hc3",s:"kiran",m:"calm",t:"\u2026in about 5 billion years! Humans have existed for about 300,000. That's a LOT of time to learn and explore."}],wrong:[{id:"hw1",s:"tobo",m:"sad",t:"Wrong guess. The shields aren't ready. Careful with supplies."}],unknown:[{id:"hu1",s:"kiran",m:"thinking",t:"Let's get Earth's view before we decide."}],afterBuild:[{id:"hb1",s:"tobo",m:"happy",t:"Shields held! I am also shiny."}],afterReport:[{id:"hr1",s:"asha",m:"determined",t:"The signal continues further out. There are more Orrin worlds."}],outro:[{id:"ho1",s:"orrin",m:"calm",t:'Fragment 3: "THE STAR CHANGES. WATCH IT EARLY."',if:"glyphSolved"},{id:"ho2",s:"kiran",m:"calm",t:"They weren't warning us about danger. They were telling us to keep watching the sky."},{id:"ho3",s:"tobo",m:"happy",t:"Next world: Tides. Coming soon. I'll pack snacks."}]}},quips:{crash:['Tobo: "I meant to do that."','Asha: "Gravity: 1, us: 0. Again!"','Kiran: "Fascinating! Also, ow."','Tobo: "New hull, who dis?"'],burnup:['Kiran: "Too deep! The air turned to fire."','Tobo: "I am now a toasted robot."'],horizon:['Kiran: "We crossed the event horizon. Not even light gets out of there!"'],lost:[`Asha: "We're drifting off the map. Let's try that again."`],timeout:['Tobo: "I fell asleep. Did we get there?"'],debris:['Tobo: "Rock! Rock! ROCK!"'],success3:['Asha: "Textbook flying. No, better than the textbook."',`Tobo: "Three stars! I'm framing this."`],success1:['Tobo: "We made it! Mostly in one piece."','Asha: "Got there. Next time, less fuel?"'],fuelSaver:[`Kiran: "You let gravity do the work. That's how the pros fly."`],nudge:['Kiran: "Great place for a break. The stars will still be here!"']},fragments:{"frag-cinder":"WE SURVIVED THE FALLING STONE.","frag-veil":"OUR SKY GREW WARMER. THE LIGHT GREW STRONGER.","frag-hollow":"THE STAR CHANGES. WATCH IT EARLY."}};var jt={_note:"Every fact the game states lives here, with a source and an honest note about what was simplified. Teachers: the 'simplification' field is the grown-up version. source.verified=false means the link could not be opened from the build environment and must be checked by a person before release (see README > Release checklist).",facts:[{id:"f-gravity-inverse-square",title:"Gravity fades with distance",text:"Twice as far from a planet, its gravity pulls only a quarter as hard. That's the inverse-square law Isaac Newton described.",source:{title:"NASA Science: Gravity",url:"https://science.nasa.gov/learn/basics-of-space-flight/",verified:!1},simplification:"The game uses Newton's law with scaled-down masses and distances, and a tiny 'softening' term so gravity never becomes infinite at a point.",concepts:["gravity-distance"]},{id:"f-orbit-falling",title:"Orbits are falling",text:"Astronauts float because they and their station are falling around Earth together, moving sideways so fast that they keep missing the ground.",source:{title:"NASA Science: Basics of Space Flight, Orbital Mechanics",url:"https://science.nasa.gov/learn/basics-of-space-flight/",verified:!1},simplification:"Game orbits are flat (2D). Real orbits are 3D and slightly disturbed by other bodies.",concepts:["orbits-falling"]},{id:"f-voyager-assist",title:"Free speed from planets",text:"Voyager 2 used flybys of Jupiter, Saturn, Uranus and Neptune to gain speed and change direction. It's now in interstellar space.",source:{title:"NASA Science: Voyager",url:"https://science.nasa.gov/mission/voyager/",verified:!1},simplification:"In the game the moon's speed is shown exaggerated so the effect is easy to feel.",concepts:["gravity-assist"]},{id:"f-iridium",title:"The iridium clue",text:"In 1980, scientists found a thin clay layer rich in iridium all over Earth. It helped show that an asteroid impact about 66 million years ago played a key part in the dinosaurs' extinction.",source:{title:"Britannica: K\u2013T extinction",url:"https://www.britannica.com/science/K-T-extinction",verified:!1},simplification:"Volcanic eruptions in India (the Deccan Traps) may also have played a role; scientists still discuss the details.",concepts:["superposition"]},{id:"f-superposition",title:"Deeper is older",text:"In undisturbed rock, each layer is younger than the one below it. Geologists call this the law of superposition.",source:{title:"Britannica: Law of superposition",url:"https://www.britannica.com/science/law-of-superposition",verified:!1},simplification:"Folding and faulting can flip real rock layers; the game's layers are undisturbed.",concepts:["superposition"]},{id:"f-venus",title:"Venus, the oven planet",text:"Venus's air is about 96% carbon dioxide. Its surface is hotter than Mercury's, even though Mercury is closer to the Sun.",source:{title:"NASA Science: Venus",url:"https://science.nasa.gov/venus/",verified:!1},simplification:"Veil is a made-up world inspired by Venus.",concepts:["greenhouse"]},{id:"f-sun-brightening",title:"Stars brighten as they age",text:"Sun-like stars slowly brighten. Our young Sun shone about 30% dimmer than it does today.",source:{title:"NASA Science: The Sun",url:"https://science.nasa.gov/sun/",verified:!1},simplification:"The FORGE time-lapse uses a simple 'about 10% brighter per billion years' rule.",concepts:["star-change","habitable-zone"]},{id:"f-habitable-zone",title:"The Goldilocks zone",text:"The habitable zone is the range of distances from a star where a planet could have liquid water on its surface. Not too hot, not too cold.",source:{title:"NASA Science: Exoplanets",url:"https://science.nasa.gov/exoplanets/",verified:!1},simplification:"Zone edges use a simple formula based on the star's brightness; real zones also depend on each planet's air.",concepts:["habitable-zone"]},{id:"f-aerobraking",title:"Braking with air",text:"Mars Reconnaissance Orbiter dipped into Mars's upper atmosphere hundreds of times in 2006 to slow down and shrink its orbit without using much fuel.",source:{title:"NASA JPL: Mars Reconnaissance Orbiter",url:"https://science.nasa.gov/mission/mars-reconnaissance-orbiter/",verified:!1},simplification:"The game squeezes many careful passes into one dramatic skim.",concepts:["atmosphere-drag"]},{id:"f-hohmann",title:"The two-burn trick",text:"The Hohmann transfer, described by Walter Hohmann in 1925, moves a spacecraft between two circular orbits with two engine burns, using very little fuel.",source:{title:"NASA Science: Basics of Space Flight, Interplanetary Trajectories",url:"https://science.nasa.gov/learn/basics-of-space-flight/",verified:!1},simplification:"Game burns happen instantly; real engines burn for minutes.",concepts:["hohmann"]},{id:"f-lagrange",title:"Calm spots in space",text:"Lagrange points are places where a small object can keep pace with a planet. The James Webb Space Telescope orbits near one of them (Sun\u2013Earth L2), and Jupiter has thousands of 'Trojan' asteroids at its L4 and L5 points.",source:{title:"NASA Science: What is a Lagrange Point?",url:"https://science.nasa.gov/resource/what-is-a-lagrange-point/",verified:!0},simplification:"The game shows L4, which is stable when the planet is much lighter than its star.",concepts:["lagrange"]},{id:"f-black-hole",title:"Black holes",text:"Inside a black hole's event horizon, gravity is so strong that not even light can escape. We spot them by the X-rays from hot gas swirling in, and by how they tug on nearby stars.",source:{title:"NASA Science: Black Holes",url:"https://science.nasa.gov/universe/black-holes/",verified:!1},simplification:"The game uses ordinary Newtonian gravity right up to the horizon; real black holes need Einstein's general relativity.",concepts:["black-holes"]},{id:"f-escape-velocity",title:"Escape velocity",text:"To leave Earth for good without more pushing, you'd need about 11.2 km/s. That's over 30 times the speed of sound!",source:{title:"Britannica: Escape velocity",url:"https://www.britannica.com/science/escape-velocity",verified:!1},simplification:"Game speeds are scaled down to fit the screen.",concepts:["escape-velocity"]},{id:"f-light-past",title:"Starlight is old news",text:"Light from the Sun takes about 8 minutes 20 seconds to reach us, and from the nearest star, Proxima Centauri, about 4.2 years. We see stars as they were when the light left.",source:{title:"NASA Science: Light-year",url:"https://science.nasa.gov/universe/stars/",verified:!1},simplification:"The Orrin system's 38 light-year distance is invented.",concepts:["light-delay"]},{id:"f-pulsar",title:"Pulsars",text:"Pulsars are spinning neutron stars that sweep beams across space like lighthouses. Jocelyn Bell Burnell discovered the first one in 1967. The Crab pulsar spins about 30 times a second.",source:{title:"NASA Science: Neutron Stars",url:"https://science.nasa.gov/universe/stars/",verified:!1},simplification:"The game shows pulse timing only, not the radio telescope data astronomers use.",concepts:["light-delay"]},{id:"f-transit",title:"Planet hunting with shadows",text:"When a planet passes in front of its star, the starlight dips a tiny bit. Most known exoplanets were found this way, by missions like Kepler and TESS.",source:{title:"NASA Science: Exoplanets, ways to find a planet",url:"https://science.nasa.gov/exoplanets/",verified:!1},simplification:"Real dips are often far smaller than 1%; the game makes them easier to see.",concepts:["light-delay"]},{id:"f-arecibo",title:"Counting in primes",text:"In 1974 the Arecibo telescope beamed a message to space. It had 1,679 bits, which is 23 \xD7 73, two primes, so aliens could arrange it into a picture.",source:{title:"SETI Institute: The Arecibo Message",url:"https://www.seti.org/",verified:!1},simplification:"The Orrin glyphs are invented, inspired by this idea.",concepts:[]},{id:"f-iron",title:"Iron stops the furnace",text:"Stars make energy by fusing light elements into heavier ones. That works all the way up to iron, but fusing iron uses up energy. In a massive star, the iron core collapses and the star explodes as a supernova.",source:{title:"NASA Science: Stars",url:"https://science.nasa.gov/universe/stars/",verified:!1},simplification:"Real stars don't get ingredients poured in! A star's mass mostly decides its fate.",concepts:["star-change"]},{id:"f-star-lifetimes",title:"Big stars live fast",text:"Massive blue stars burn out in a few million years. Small red dwarfs can shine for trillions of years, longer than the universe has existed so far.",source:{title:"NASA Science: Stars",url:"https://science.nasa.gov/universe/stars/",verified:!1},simplification:"The game uses the rule lifetime \u2248 10 billion years \xD7 mass^-2.5.",concepts:["star-change"]},{id:"f-red-giant",title:"Red giants",text:"When a Sun-like star runs low on hydrogen in its core, it swells into a red giant, then sheds its outer layers and leaves a white dwarf.",source:{title:"NASA Science: Stars",url:"https://science.nasa.gov/universe/stars/",verified:!1},simplification:"The game's time-lapse skips the detailed stages.",concepts:["star-change"]},{id:"f-sun-future",title:"Our Sun's long future",text:"Our Sun is about halfway through its life. In roughly 5 billion years it will become a red giant. Modern humans have been around for about 300,000 years.",source:{title:"NASA Science: The Sun",url:"https://science.nasa.gov/sun/",verified:!1},simplification:"Scientists also estimate Earth may get too warm for oceans in about a billion years, still an enormous span of time.",concepts:["star-change"]},{id:"f-cme",title:"Space weather",text:"Solar flares are bursts of light and radiation. Coronal mass ejections (CMEs) are huge clouds of charged gas that can shake Earth's magnetic field and damage satellites.",source:{title:"NOAA Space Weather Prediction Center",url:"https://www.swpc.noaa.gov/",verified:!1},simplification:"In the game a CME gives the ship a gentle shove; a real one wouldn't noticeably push a heavy spacecraft.",concepts:[]},{id:"f-dust-storm",title:"Planet-wide dust storms",text:"In 2018 a dust storm covered all of Mars and blocked so much sunlight that the solar-powered Opportunity rover went silent.",source:{title:"NASA Science: Opportunity",url:"https://science.nasa.gov/mission/mars-exploration-rovers-spirit-and-opportunity/",verified:!1},simplification:"Cinder's storms are shorter than real Martian ones.",concepts:[]},{id:"f-moon-phases",title:"Why the Moon has phases",text:"Half of the Moon is always lit by the Sun. Phases come from how much of that lit half we see from Earth, not from Earth's shadow.",source:{title:"NASA Science: Moon Phases",url:"https://science.nasa.gov/moon/",verified:!1},simplification:"The game's moon-phase calculation can be off by a few hours.",concepts:[]}]};var Gt={tuning:{cadet:{fuelMult:1.3,previewSeconds:3,hintAfterFails:1,extraCharges:2,showNumbers:!1},commander:{fuelMult:1,previewSeconds:2,hintAfterFails:2,extraCharges:0,showNumbers:!0},fullPreviewSeconds:8,fullPreviewUnlockStars:6},gallery:[{id:"g-earthrise",title:"Earthrise",caption:"Earth rising over the Moon, photographed by the Apollo 8 crew in 1968.",unlockedBy:"cinder",palette:["#0b1a3a","#3a7bd5","#9fd3ff"],image:null,todo:"Replace with the public-domain NASA Apollo 8 'Earthrise' photo (AS08-14-2383). Record its source in assets/LICENSES.md."},{id:"g-venus",title:"Venus in ultraviolet",caption:"Thick clouds of sulfuric acid wrap Venus, seen here in ultraviolet light.",unlockedBy:"veil",palette:["#2b1d05","#d6c75a","#fff1b8"],image:null,todo:"Replace with a public-domain NASA Venus image (e.g. Mariner 10 / Pioneer Venus). Record source + licence."},{id:"g-crab",title:"Crab Nebula",caption:"The leftovers of a supernova seen in 1054, with a pulsar spinning at its heart.",unlockedBy:"veil",palette:["#0c0420","#ff5fa2","#7fd3ff"],image:null,todo:"Replace with a Hubble/Webb Crab Nebula image. NASA images are generally public domain; ESA/Webb images are often CC BY 4.0 and need credit."},{id:"g-betelgeuse",title:"A red supergiant",caption:"Betelgeuse, in Orion, is a red supergiant hundreds of times wider than the Sun.",unlockedBy:
